<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>力合·人才智库 - 力合科创干部数智平台</title>
<style>
/* ==================== 设计规范 ==================== */
:root {
  --color-primary: #8e2294;
  --color-primary-dark: #6b1a70;
  --color-primary-light: #a855a8;
  --color-accent: #F8C24C;
  --color-accent-light: #fdecc8;
  --color-bg: #f5f3f7;
  --color-surface: #ffffff;
  --color-text: #1a1a2e;
  --color-text-secondary: #4a4a6a;
  --color-border: #e8e0ec;
  --color-success: #27ae60;
  --color-success-bg: #e8f8ef;
  --color-warning: #e67e22;
  --color-warning-bg: #fef4e8;
  --color-danger: #c0392b;
  --color-danger-bg: #fbe9e7;
  --color-info: #3498db;
  --color-info-bg: #eaf5fb;
  --font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Helvetica Neue", Arial, sans-serif;
  --font-size-xs: 0.75rem;
  --font-size-sm: 0.875rem;
  --font-size-base: 1rem;
  --font-size-lg: 1.125rem;
  --font-size-xl: 1.25rem;
  --font-size-2xl: 1.5rem;
  --font-size-3xl: 2rem;
  --header-height: 64px;
  --sidebar-width: 240px;
  --sidebar-collapsed-width: 64px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --shadow-sm: 0 1px 2px rgba(90, 20, 126, 0.05);
  --shadow-md: 0 4px 12px rgba(90, 20, 126, 0.08);
  --shadow-lg: 0 10px 24px rgba(90, 20, 126, 0.12);
  --transition-fast: 0.15s ease;
  --transition-base: 0.25s ease;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; font-family: var(--font-family); font-size: 14px; color: var(--color-text); background: var(--color-bg); }
body { min-height: 100vh; }
a { text-decoration: none; color: inherit; }
button { font-family: inherit; }

/* ==================== 布局 ==================== */
.app-layout { display: flex; min-height: 100vh; }
.app-header {
  position: fixed; top: 0; left: 0; right: 0; height: var(--header-height);
  background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
  color: #fff; display: flex; align-items: center; justify-content: space-between;
  padding: 0 var(--spacing-6); box-shadow: var(--shadow-md); z-index: 1000;
}
.header-brand { display: flex; align-items: center; gap: 12px; }
.brand-icon {
  width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,0.15);
  display: flex; align-items: center; justify-content: center; color: #fff;
}
.brand-text { font-size: var(--font-size-xl); font-weight: 700; letter-spacing: 1px; line-height: 1.2; }
.brand-text-wrap { display: flex; flex-direction: column; justify-content: center; }
.brand-subtitle { font-size: 12px; opacity: 0.9; letter-spacing: 0.5px; margin-top: 2px; }
.page-title { font-size: var(--font-size-sm); opacity: 0.9; margin-left: 12px; padding-left: 12px; border-left: 1px solid rgba(255,255,255,0.3); }
.header-actions { display: flex; align-items: center; gap: 16px; }
.user-info { display: flex; align-items: center; gap: 10px; }
.user-name { font-size: var(--font-size-sm); }
.user-avatar {
  width: 34px; height: 34px; border-radius: 50%; background: var(--color-accent); color: var(--color-text);
  display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: var(--font-size-sm);
}
.header-btn { display: none; background: none; border: none; color: #fff; cursor: pointer; padding: 6px; border-radius: 6px; }
.header-btn:hover { background: rgba(255,255,255,0.15); }

/* ==================== 侧边栏 ==================== */
.app-sidebar {
  position: fixed; top: var(--header-height); left: 0; bottom: 0; width: var(--sidebar-width);
  background: var(--color-surface); border-right: 1px solid var(--color-border);
  display: flex; flex-direction: column; z-index: 900; transition: transform var(--transition-base);
}
.sidebar-nav { flex: 1; padding: var(--spacing-4) 0; }
.sidebar-link {
  display: flex; align-items: center; gap: 12px; padding: 14px var(--spacing-6);
  color: var(--color-text-secondary); font-size: var(--font-size-base);
  transition: all var(--transition-fast); border-left: 3px solid transparent;
}
.sidebar-link:hover { background: #faf7fb; color: var(--color-primary); }
.sidebar-link.active {
  background: linear-gradient(90deg, rgba(142,34,148,0.08) 0%, rgba(142,34,148,0.02) 100%);
  color: var(--color-primary); border-left-color: var(--color-primary); font-weight: 600;
}
.sidebar-link svg { flex-shrink: 0; }
.sidebar-footer { padding: var(--spacing-4) var(--spacing-6); font-size: var(--font-size-xs); color: var(--color-text-secondary); border-top: 1px solid var(--color-border); }

/* ==================== 主内容 ==================== */
.app-main {
  flex: 1; margin-left: var(--sidebar-width); margin-top: var(--header-height);
  padding: var(--spacing-6); min-height: calc(100vh - var(--header-height));
}
.app-main.no-sidebar { margin-left: 0; }

/* ==================== 通用卡片 ==================== */
.card { background: var(--color-surface); border-radius: var(--radius-lg); padding: var(--spacing-5); box-shadow: var(--shadow-md); margin-bottom: var(--spacing-5); }
.card-title { font-size: var(--font-size-lg); font-weight: 600; color: var(--color-text); margin-bottom: var(--spacing-4); padding-bottom: var(--spacing-3); border-bottom: 3px solid var(--color-primary); }
.card-title.accent { border-bottom-color: var(--color-accent); }

/* ==================== 统计卡片 ==================== */
.stat-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--spacing-5); margin-bottom: var(--spacing-6); }
.stat-card {
  background: var(--color-surface); border-radius: var(--radius-lg); padding: var(--spacing-5);
  box-shadow: var(--shadow-md); display: flex; flex-direction: column; gap: var(--spacing-2); border-top: 4px solid var(--color-primary);
}
.stat-card.accent { border-top-color: var(--color-accent); }
.stat-label { font-size: var(--font-size-sm); color: var(--color-text-secondary); }
.stat-value { font-size: var(--font-size-3xl); font-weight: 700; color: var(--color-primary); }
.stat-value.accent { color: var(--color-accent); }

/* ==================== 按钮 ==================== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 20px; border-radius: var(--radius-md); font-size: var(--font-size-sm); font-weight: 500; cursor: pointer; transition: all var(--transition-fast); border: none; }
.btn-primary { background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%); color: #fff; box-shadow: 0 2px 8px rgba(142,34,148,0.25); }
.btn-primary:hover { box-shadow: 0 4px 12px rgba(142,34,148,0.35); transform: translateY(-1px); }
.btn-outline { background: transparent; border: 1px solid var(--color-border); color: var(--color-text-secondary); }
.btn-outline:hover { border-color: var(--color-primary); color: var(--color-primary); }

/* ==================== 表单 ==================== */
.form-input, .form-select { padding: 10px 14px; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: var(--font-size-sm); color: var(--color-text); background: var(--color-surface); outline: none; transition: all var(--transition-fast); }
.form-input:focus, .form-select:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(142,34,148,0.1); }

/* ==================== 标签 ==================== */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 20px; font-size: var(--font-size-xs); font-weight: 500; }
.badge-primary { background: rgba(142,34,148,0.1); color: var(--color-primary); }
.badge-success { background: var(--color-success-bg); color: var(--color-success); }
.badge-warning { background: var(--color-warning-bg); color: var(--color-warning); }
.badge-danger { background: var(--color-danger-bg); color: var(--color-danger); }
.badge-accent { background: var(--color-accent-light); color: #8a6d1f; }

/* ==================== 分页 ==================== */
.pagination { display: flex; justify-content: center; align-items: center; gap: 8px; padding: 16px 0; }
.pagination button { padding: 8px 14px; border: 1px solid var(--color-border); background: var(--color-surface); border-radius: var(--radius-md); cursor: pointer; font-size: var(--font-size-sm); color: var(--color-text-secondary); transition: all var(--transition-fast); }
.pagination button:hover { border-color: var(--color-primary); color: var(--color-primary); }
.pagination button.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
.pagination button:disabled { opacity: 0.5; cursor: not-allowed; }

/* ==================== 弹窗 ==================== */
.modal-overlay { position: fixed; inset: 0; background: rgba(26,26,46,0.6); display: flex; align-items: center; justify-content: center; z-index: 2000; opacity: 0; visibility: hidden; transition: all var(--transition-base); }
.modal-overlay.active { opacity: 1; visibility: visible; }
.modal { background: var(--color-surface); border-radius: var(--radius-lg); padding: var(--spacing-6); max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; box-shadow: var(--shadow-lg); transform: scale(0.95); transition: transform var(--transition-base); }
.modal-overlay.active .modal { transform: scale(1); }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-4); padding-bottom: var(--spacing-3); border-bottom: 2px solid var(--color-border); }
.modal-title { font-size: var(--font-size-xl); font-weight: 600; color: var(--color-text); }
.modal-close { background: none; border: none; font-size: 24px; color: var(--color-text-secondary); cursor: pointer; }
.modal-body p { margin-bottom: 8px; font-size: 14px; line-height: 1.6; }

/* ==================== Dashboard 专属 ==================== */
.dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
.charts-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
.chart-card { background: var(--color-surface); border-radius: 12px; padding: 20px; box-shadow: var(--shadow-md); }
.chart-card-title { font-size: 15px; font-weight: 600; color: var(--color-text); margin-bottom: 16px; padding-bottom: 10px; border-bottom: 3px solid var(--color-primary); }
.chart-card-title.accent { border-bottom-color: var(--color-accent); }
.chart-container { display: flex; justify-content: center; align-items: center; min-height: 250px; }
.alert-list { display: flex; flex-direction: column; gap: 12px; }
.alert-item { display: flex; align-items: flex-start; gap: 12px; padding: 14px; background: #fff; border-radius: 10px; border-left: 4px solid var(--color-accent); box-shadow: 0 1px 4px rgba(142,34,148,0.06); }
.alert-icon { width: 36px; height: 36px; border-radius: 50%; background: var(--color-accent-light); color: #8a6d1f; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.alert-content { flex: 1; }
.alert-title { font-weight: 600; font-size: 14px; color: var(--color-text); margin-bottom: 4px; }
.alert-desc { font-size: 12px; color: var(--color-text-secondary); line-height: 1.5; }
.alert-days { font-size: 12px; color: var(--color-danger); font-weight: 600; white-space: nowrap; }
.bottom-section { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 20px; }
.quick-entry { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
.quick-card { background: linear-gradient(135deg, rgba(142,34,148,0.08), rgba(142,34,148,0.02)); border: 1px solid var(--color-border); border-radius: 10px; padding: 16px; text-align: center; cursor: pointer; transition: all 0.2s; }
.quick-card:hover { border-color: var(--color-primary); box-shadow: 0 4px 12px rgba(142,34,148,0.12); }
.quick-icon { width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark)); color: #fff; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; font-size: 18px; }
.quick-label { font-size: 13px; color: var(--color-text); font-weight: 500; }

/* ==================== 干部列表 专属 ==================== */
.filter-bar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
.cadre-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.cadre-card { background: var(--color-surface); border-radius: 12px; padding: 20px; box-shadow: var(--shadow-md); display: flex; gap: 16px; align-items: center; transition: all 0.2s; cursor: pointer; border-left: 4px solid transparent; }
.cadre-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(142,34,148,0.15); border-left-color: var(--color-primary); }
.cadre-avatar { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark)); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; flex-shrink: 0; }
.cadre-info { flex: 1; min-width: 0; }
.cadre-name { font-size: 16px; font-weight: 600; color: var(--color-text); margin-bottom: 4px; }
.cadre-dept { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 8px; }
.cadre-tags { display: flex; gap: 6px; flex-wrap: wrap; }

/* ==================== 干部详情 专属 ==================== */
.back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--color-primary); font-size: 14px; margin-bottom: 16px; cursor: pointer; }
.back-link:hover { text-decoration: underline; }
.detail-header { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; padding: 24px; background: var(--color-surface); border-radius: 12px; box-shadow: var(--shadow-md); }
.detail-avatar { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark)); display: flex; align-items: center; justify-content: center; font-size: 32px; color: #fff; font-weight: 700; }
.detail-info h1 { font-size: 24px; font-weight: 700; color: var(--color-text); margin-bottom: 8px; }
.detail-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--color-text-secondary); }
.detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
.detail-card { background: var(--color-surface); border-radius: 12px; padding: 20px; box-shadow: var(--shadow-md); }
.detail-card-title { font-size: 16px; font-weight: 600; color: var(--color-text); margin-bottom: 16px; padding-bottom: 12px; border-bottom: 3px solid var(--color-primary); }
.detail-card-title.warning { border-bottom-color: var(--color-accent); }
.detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--color-border); font-size: 14px; }
.detail-row:last-child { border-bottom: none; }
.detail-label { color: var(--color-text-secondary); }
.detail-value { color: var(--color-text); font-weight: 500; }
.detail-value.accent { color: #8a6d1f; font-weight: 600; }
.warning-item { padding: 12px; background: var(--color-accent-light); border-radius: 8px; border-left: 4px solid var(--color-accent); margin-bottom: 10px; }
.warning-title { font-weight: 600; color: #8a6d1f; margin-bottom: 4px; }
.warning-desc { font-size: 13px; color: #4a4a6a; }

/* ==================== 任免管理 专属 ==================== */
.lane-container { background: var(--color-surface); border-radius: 12px; padding: 20px; box-shadow: var(--shadow-md); overflow-x: auto; margin-bottom: 20px; }
.swimlane { display: grid; grid-template-columns: 100px repeat(12, 1fr); gap: 1px; min-width: 900px; background: var(--color-border); border-radius: 8px; overflow: hidden; }
.lane-header { background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark)); color: #fff; padding: 14px 10px; font-weight: 600; font-size: 13px; display: flex; align-items: center; justify-content: center; text-align: center; }
.month-header { background: #f9f7fb; padding: 10px; text-align: center; font-size: 12px; color: #4a4a6a; font-weight: 500; }
.lane-row { background: #fff; padding: 10px; min-height: 60px; position: relative; }
.lane-label { background: #f9f7fb; padding: 10px; font-size: 13px; color: var(--color-text); font-weight: 500; display: flex; align-items: center; }
.lane-node { position: absolute; padding: 8px 10px; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: transform 0.2s; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
.lane-node:hover { transform: translateY(-2px); z-index: 10; }
.lane-node.promote { background: var(--color-accent-light); color: #8a6d1f; border: 1px solid var(--color-accent); }
.lane-node.transfer { background: #e8f8f5; color: #1abc9c; border: 1px solid #a3e4d7; }
.lane-node.demote { background: #fdeaea; color: #c0392b; border: 1px solid #f5b7b1; }
.lane-node.dismiss { background: #eaf5fb; color: #2980b9; border: 1px solid #aed6f1; }
.appointment-list { background: var(--color-surface); border-radius: 12px; padding: 20px; box-shadow: var(--shadow-md); }
.appointment-list-title { font-size: 16px; font-weight: 600; color: var(--color-text); margin-bottom: 16px; padding-bottom: 12px; border-bottom: 3px solid var(--color-primary); }
.app-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--color-border); }
.app-item:last-child { border-bottom: none; }
.app-info h4 { font-size: 14px; color: var(--color-text); margin-bottom: 4px; }
.app-info p { font-size: 12px; color: var(--color-text-secondary); }

/* ==================== 董监高 专属 ==================== */
.directors-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.director-card { background: var(--color-surface); border-radius: 12px; padding: 24px; box-shadow: var(--shadow-md); border-top: 4px solid var(--color-primary); transition: all 0.2s; }
.director-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(142,34,148,0.15); }
.director-card.warning { border-top-color: var(--color-accent); }
.director-card.danger { border-top-color: var(--color-danger); }
.director-header { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
.director-avatar { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark)); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; flex-shrink: 0; }
.director-name { font-size: 18px; font-weight: 600; color: var(--color-text); }
.director-position { font-size: 14px; color: var(--color-text-secondary); margin-top: 2px; }
.director-body { display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
.director-row { display: flex; justify-content: space-between; }
.director-label { color: var(--color-text-secondary); }
.director-value { color: var(--color-text); font-weight: 500; }
.director-value.warning { color: #8a6d1f; font-weight: 600; }
.term-progress { margin-top: 14px; }
.term-progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--color-text-secondary); margin-bottom: 6px; }
.term-progress-bar { height: 8px; background: var(--color-border); border-radius: 4px; overflow: hidden; }
.term-progress-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--color-primary), var(--color-primary-dark)); transition: width 0.5s ease; }
.term-progress-fill.warning { background: linear-gradient(90deg, var(--color-accent), #f39c12); }
.term-progress-fill.danger { background: linear-gradient(90deg, var(--color-danger), #e74c3c); }

/* ==================== 档案管理 专属 ==================== */
.archive-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.archive-tab { padding: 10px 20px; border: 1px solid var(--color-border); background: var(--color-surface); border-radius: 8px; font-size: 14px; color: var(--color-text-secondary); cursor: pointer; transition: all 0.2s; }
.archive-tab:hover { border-color: var(--color-primary); color: var(--color-primary); }
.archive-tab.active { background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark)); color: #fff; border-color: var(--color-primary); box-shadow: 0 4px 12px rgba(142,34,148,0.25); }
.archive-content { background: var(--color-surface); border-radius: 12px; padding: 20px; box-shadow: var(--shadow-md); }
.doc-list { display: flex; flex-direction: column; gap: 10px; }
.doc-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 10px; background: var(--color-bg); transition: all 0.2s; }
.doc-item:hover { background: #f0ecf5; }
.doc-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.doc-icon.pdf { background: #fdeaea; color: #c0392b; }
.doc-icon.doc { background: #eaf5fb; color: #2980b9; }
.doc-icon.xls { background: #e8f8ef; color: #27ae60; }
.doc-icon.img { background: #fef4e8; color: #d35400; }
.doc-info { flex: 1; min-width: 0; }
.doc-name { font-size: 14px; font-weight: 500; color: var(--color-text); margin-bottom: 2px; }
.doc-meta { font-size: 12px; color: var(--color-text-secondary); }
.doc-actions { display: flex; gap: 8px; }
.doc-btn { padding: 6px 12px; border: 1px solid var(--color-border); background: #fff; border-radius: 6px; font-size: 12px; color: var(--color-text-secondary); cursor: pointer; transition: all 0.2s; }
.doc-btn:hover { border-color: var(--color-primary); color: var(--color-primary); }
.doc-btn.primary:hover { background: var(--color-primary); color: #fff; }

/* ==================== 九宫格盘点 专属 ==================== */
.review-layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
.ninebox-panel { background: var(--color-surface); border-radius: 12px; padding: 20px; box-shadow: var(--shadow-md); }
.ninebox-title { font-size: 16px; font-weight: 600; color: var(--color-text); margin-bottom: 16px; padding-bottom: 12px; border-bottom: 3px solid var(--color-primary); }
.ninebox-container { display: flex; justify-content: center; }
.stats-panel { display: flex; flex-direction: column; gap: 16px; }
.stats-card { background: var(--color-surface); border-radius: 12px; padding: 20px; box-shadow: var(--shadow-md); }
.stats-card-title { font-size: 15px; font-weight: 600; color: var(--color-text); margin-bottom: 14px; }
.stats-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--color-border); font-size: 13px; }
.stats-item:last-child { border-bottom: none; }
.stats-label { color: var(--color-text-secondary); }
.stats-value { font-weight: 600; color: var(--color-text); }
.stats-bar { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.stats-bar-track { flex: 1; height: 6px; background: var(--color-border); border-radius: 3px; overflow: hidden; }
.stats-bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--color-primary), var(--color-primary-dark)); transition: width 0.5s ease; }
.people-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.people-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--color-bg); border-radius: 8px; font-size: 13px; }
.people-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark)); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; flex-shrink: 0; }
.people-info { flex: 1; }
.people-name { font-weight: 500; color: var(--color-text); }
.people-dept { font-size: 11px; color: var(--color-text-secondary); }
.people-score { font-size: 12px; color: var(--color-primary); font-weight: 600; }

/* ==================== 图表响应式（SVG 已带 viewBox，容器 100% 即等比缩放） ==================== */
.chart-container svg, .ninebox-container svg { width: 100%; height: auto; max-width: 100%; }

/* ==================== 响应式 ==================== */
@media (max-width: 1200px) {
  .charts-row { grid-template-columns: 1fr; }
  .dashboard-grid, .bottom-section { grid-template-columns: 1fr; }
  .cadre-grid { grid-template-columns: repeat(2, 1fr); }
  .directors-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 1024px) {
  .stat-cards { grid-template-columns: repeat(2, 1fr); }
  .review-layout { grid-template-columns: 1fr; }
}
@media (max-width: 768px) {
  .app-sidebar { transform: translateX(-100%); max-width: 80vw; }
  .app-sidebar.sidebar-open { transform: translateX(0); }
  .app-main { margin-left: 0; }
  .header-btn { display: block; }
  .stat-cards { grid-template-columns: 1fr; }
  .page-title { display: none; }
  .user-name { display: none; }
  .cadre-grid { grid-template-columns: 1fr; }
  .directors-grid { grid-template-columns: 1fr; }
  .detail-grid { grid-template-columns: 1fr; }
  .detail-header { flex-direction: column; text-align: center; }
  .lane-container { padding: 12px; }
  .swimlane { min-width: 700px; }
}
@media (max-width: 480px) {
  :root { --header-height: 56px; }
  .app-header { padding: 0 12px; }
  .brand-subtitle { display: none; }
  .brand-text { font-size: 18px; }
  .app-main { padding: 12px; }
  .card, .chart-card, .detail-card, .director-card, .ninebox-panel, .stats-card, .appointment-list, .lane-container, .archive-content { padding: 14px; }
  .stat-cards { gap: 10px; }
  .stat-card { padding: 12px; }
  .stat-value { font-size: 26px; }
  .quick-entry { grid-template-columns: 1fr; }
  .charts-row { gap: 12px; }
  .detail-header { padding: 16px; }
  .detail-avatar { width: 60px; height: 60px; font-size: 24px; }
  .detail-info h1 { font-size: 20px; }
}
</style>
</head>

  '/cadre': {

          grid.appendChild(card);
        });
        renderPagination();

        const totalPages = Math.ceil(filtered.length/pageSize), pag = document.getElementById('pagination'); pag.innerHTML = '';

      const avgAbility = (merged.reduce((s,m)=>s+m.abilityScore,0)/merged.length).toFixed(1);
      const avgPotential = (merged.reduce((s,m)=>s+m.potentialScore,0)/merged.length).toFixed(1);
      document.getElementById('overviewStats').innerHTML = `<div class="stats-item"><span class="stats-label">参与盘点人数</span><span class="stats-value">${merged.length} 人</span></div><div class="stats-item"><span class="stats-label">平均绩效分</span><span class="stats-value">${avgPerf}</span></div><div class="stats-item"><span class="stats-label">平均能力分</span><span class="stats-value">${avgAbility}</span></div><div class="stats-item"><span class="stats-label">平均潜力分</span><span class="stats-value">${avgPotential}</span></div>`;
      const counts = quadrants.map(q => ({ label:q.label, count: merged.filter(m => { const qx=Math.min(2,Math.floor(m.nineBoxX/1.67)), qy=Math.min(2,Math.floor(m.nineBoxY/1.67)); return q.x===qx && q.y===qy; }).length }));
      const maxCount = Math.max(...counts.map(c => c.count));
      document.getElementById('quadrantStats').innerHTML = counts.map(c => `<div class="stats-item"><span class="stats-label">${c.label}</span><span class="stats-value">${c.count} 人</span></div><div class="stats-bar"><div class="stats-bar-track"><div class="stats-bar-fill" style="width:${(c.count/maxCount*100).toFixed(0)}%"></div></div><span style="font-size:12px;color:#4a4a6a">${c.count}</span></div>`).join('');
      const core = merged.filter(m => { const qx=Math.min(2,Math.floor(m.nineBoxX/1.67)), qy=Math.min(2,Math.floor(m.nineBoxY/1.67)); return qx===2 && qy===2; });
      document.getElementById('corePeople').innerHTML = core.map(c => `<div class="people-item"><div class="people-avatar">${c.name.charAt(0)}</div><div class="people-info"><div class="people-name">${c.name}</div><div class="people-dept">${c.department}</div></div><div class="people-score">${c.performanceScore}</div></div>`).join('');
    }
  }
};

/* 启动 */
window.addEventListener('hashchange', renderRoute);
window.addEventListener('DOMContentLoaded', renderRoute);
if (document.readyState !== 'loading') renderRoute();
</script>
