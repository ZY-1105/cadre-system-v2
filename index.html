<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>力合·人才智库 - 力合科创干部数智平台</title>
  <style>
    :root {
      --color-primary: #8e2294;
      --color-primary-dark: #6b1a70;
      --color-accent: #F8C24C;
      --color-bg: #f5f3f7;
      --color-text: #1a1a2e;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .brand-logo {
      width: 90px;
      height: 90px;
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 40px rgba(142, 34, 148, 0.35);
      margin-bottom: 28px;
      animation: logoPulse 1.5s ease-in-out infinite;
    }

    .brand-logo svg {
      width: 52px;
      height: 52px;
      fill: #ffffff;
    }

    @keyframes logoPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    .brand-name {
      font-size: 30px;
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    .brand-subtitle {
      font-size: 15px;
      color: #4a4a6a;
      margin-bottom: 40px;
      letter-spacing: 1px;
    }

    .loading-ring {
      width: 50px;
      height: 50px;
      position: relative;
      margin-bottom: 24px;
    }

    .loading-ring::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 4px solid transparent;
      border-top-color: var(--color-primary);
      border-right-color: var(--color-accent);
      animation: spin 1s linear infinite;
    }

    .loading-ring::after {
      content: '';
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-bottom-color: var(--color-primary-dark);
      border-left-color: var(--color-primary);
      animation: spin 1.3s linear infinite reverse;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 14px;
      color: #4a4a6a;
      animation: textFade 1.2s ease-in-out infinite;
    }

    @keyframes textFade {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .progress-bar {
      width: 180px;
      height: 4px;
      background: #e8e0ec;
      border-radius: 2px;
      margin-top: 24px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--color-primary), var(--color-accent));
      border-radius: 2px;
      animation: progressFill 1.5s ease-in-out forwards;
    }

    @keyframes progressFill {
      0% { width: 0%; }
      80% { width: 100%; }
      100% { width: 100%; }
    }

    .footer {
      position: fixed;
      bottom: 24px;
      font-size: 12px;
      color: #4a4a6a;
    }

    body.fade-out {
      animation: fadeOut 0.5s ease forwards;
    }

    @keyframes fadeOut {
      to { opacity: 0; }
    }
  </style>
  <script>
    setTimeout(() => {
      document.body.classList.add('fade-out');
      setTimeout(() => {
        window.location.href = 'pages/dashboard.html';
      }, 500);
    }, 1500);
  </script>
</head>
<body>
  <div class="brand-logo">
    <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
      <path d="M24 4 L40 13 L40 35 L24 44 L8 35 L8 13 Z"/>
      <path d="M24 14 L32 19 L32 29 L24 34 L16 29 L16 19 Z" fill="rgba(248,194,76,0.4)"/>
      <circle cx="24" cy="24" r="4" fill="#F8C24C"/>
    </svg>
  </div>

  <div class="brand-name">力合·人才智库</div>
  <div class="brand-subtitle">力合科创干部数智平台</div>

  <div class="loading-ring"></div>
  <div class="loading-text">力合科创干部数智平台加载中...</div>

  <div class="progress-bar">
    <div class="progress-fill"></div>
  </div>

  <div class="footer">© 2024 力合科创干部数智平台 · 人力资源部</div>
</body>
</html>
