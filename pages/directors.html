
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>董监高管理 - 力合·人才智库 - 力合科创干部数智平台</title>
<link rel="stylesheet" href="../css/base-k3.css">
<style>
/* ===== 页面级样式（K3风格增量） ===== */
.dgj-page {
  padding: 20px 24px 40px;
  max-width: 1400px;
  margin: 0 auto;
}

/* Stats Bar */
.dgj-stats {
  display: flex;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.dgj-stat-chip {
  background: var(--color-surface, #fff);
  border: 1px solid var(--color-border, #e8e5f0);
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 13px;
  color: var(--color-text-secondary, #5b6b82);
  box-shadow: 0 1px 3px rgba(142,34,148,0.06);
}
.dgj-stat-chip b {
  color: #8e2294;
  font-size: 15px;
  margin: 0 2px;
}

/* Control Panel */
.dgj-control {
  background: var(--color-surface, #fff);
  border-radius: 10px;
  padding: 20px;
  box-shadow: 0 1px 3px rgba(142,34,148,0.06);
  border: 1px solid var(--color-border, #e8e5f0);
  margin-bottom: 16px;
}
.dgj-control-row {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  flex-wrap: wrap;
}
.dgj-control-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 200px;
  flex: 1;
}
.dgj-control-group label {
  font-size: 12px;
  color: var(--color-text-secondary, #5b6b82);
  font-weight: 500;
}

/* Category Tabs */
.dgj-cat-tabs {
  display: flex;
  gap: 4px;
  background: #F8F7FC;
  border-radius: 6px;
  padding: 4px;
  border: 1px solid var(--color-border, #e8e5f0);
}
.dgj-cat-tab {
  padding: 8px 18px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  color: var(--color-text-secondary, #5b6b82);
  background: transparent;
  border: none;
  transition: all 0.2s;
  white-space: nowrap;
}
.dgj-cat-tab:hover { color: #8e2294; }
.dgj-cat-tab.active {
  background: #8e2294;
  color: #fff;
  box-shadow: 0 2px 6px rgba(142,34,148,0.25);
}

/* Searchable Select */
.dgj-select-wrap {
  position: relative;
  flex: 2;
  min-width: 280px;
}
.dgj-select-input {
  width: 100%;
  padding: 9px 36px 9px 12px;
  border: 1px solid var(--color-border, #e8e5f0);
  border-radius: 6px;
  font-size: 13px;
  outline: none;
  background: var(--color-surface, #fff);
  color: var(--color-text, #1f2b3d);
  transition: all 0.2s;
  cursor: pointer;
}
.dgj-select-input:focus {
  border-color: #8e2294;
  box-shadow: 0 0 0 3px rgba(142,34,148,0.08);
}
.dgj-select-arrow {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--color-text-secondary, #5b6b82);
  pointer-events: none;
  font-size: 10px;
}
.dgj-select-dropdown {
  position: absolute;
  top: calc(100% + 4px);
  left: 0; right: 0;
  background: var(--color-surface, #fff);
  border: 1px solid var(--color-border, #e8e5f0);
  border-radius: 6px;
  box-shadow: 0 4px 16px rgba(142,34,148,0.12);
  max-height: 320px;
  overflow-y: auto;
  z-index: 50;
  display: none;
}
.dgj-select-dropdown.show { display: block; }
.dgj-select-search {
  padding: 8px 12px;
  border-bottom: 1px solid var(--color-border, #e8e5f0);
  position: sticky;
  top: 0;
  background: var(--color-surface, #fff);
}
.dgj-select-search input {
  width: 100%;
  padding: 6px 10px;
  border: 1px solid var(--color-border, #e8e5f0);
  border-radius: 6px;
  font-size: 13px;
  outline: none;
}
.dgj-select-search input:focus { border-color: #8e2294; }
.dgj-select-option {
  padding: 9px 14px;
  cursor: pointer;
  font-size: 13px;
  color: var(--color-text, #1f2b3d);
  border-bottom: 1px solid rgba(0,0,0,0.03);
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.dgj-select-option:hover {
  background: #f3e5f5;
  color: #6b1a70;
}
.dgj-select-option.selected {
  background: #f3e5f5;
  color: #8e2294;
  font-weight: 600;
}
.dgj-select-option .opt-tag {
  font-size: 11px;
  color: var(--color-text-secondary, #5b6b82);
  background: #F8F7FC;
  padding: 1px 6px;
  border-radius: 4px;
}
.dgj-select-empty {
  padding: 20px;
  text-align: center;
  color: var(--color-text-secondary, #5b6b82);
  font-size: 13px;
}

/* Company Info Card */
.dgj-info-card {
  background: linear-gradient(135deg, #faf8ff 0%, #f5f0ff 100%);
  border: 1px solid #e8dff5;
  border-radius: 10px;
  padding: 16px 20px;
  margin-top: 16px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  transition: all 0.2s;
}
.dgj-info-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(142,34,148,0.08), 0 2px 4px rgba(0,0,0,0.04);
}
.dgj-info-left { flex: 1; min-width: 300px; }
.dgj-info-name {
  font-size: 16px;
  font-weight: 600;
  color: var(--color-text, #1f2b3d);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.dgj-info-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.dgj-info-tag {
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(142,34,148,0.08);
  color: #8e2294;
  border: 1px solid rgba(142,34,148,0.12);
  font-weight: 500;
}
.dgj-info-tag.secondary {
  background: #F8F7FC;
  color: var(--color-text-secondary, #5b6b82);
  border-color: var(--color-border, #e8e5f0);
}
.dgj-info-right { display: flex; align-items: center; gap: 8px; }

/* Buttons */
.dgj-btn {
  padding: 8px 16px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  outline: none;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.dgj-btn-primary {
  background: #8e2294;
  color: #fff;
  box-shadow: 0 2px 6px rgba(142,34,148,0.25);
}
.dgj-btn-primary:hover {
  background: #6b1a70;
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(142,34,148,0.3);
}
.dgj-btn-ghost {
  background: transparent;
  color: #8e2294;
  border: 1px solid #8e2294;
}
.dgj-btn-ghost:hover { background: #f3e5f5; }

/* Tabs */
.dgj-tabs-bar {
  display: flex;
  gap: 4px;
  margin-bottom: 16px;
  border-bottom: 2px solid var(--color-border, #e8e5f0);
  padding-bottom: 0;
}
.dgj-tab {
  padding: 10px 20px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  color: var(--color-text-secondary, #5b6b82);
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: all 0.2s;
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
}
.dgj-tab:hover { color: #8e2294; }
.dgj-tab.active {
  color: #8e2294;
  border-bottom-color: #8e2294;
}

/* Table */
.dgj-table-wrap {
  background: var(--color-surface, #fff);
  border-radius: 10px;
  box-shadow: 0 1px 3px rgba(142,34,148,0.06);
  border: 1px solid var(--color-border, #e8e5f0);
  overflow: hidden;
}
.dgj-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.dgj-table th {
  background: #F8F7FC;
  color: var(--color-text-secondary, #5b6b82);
  font-weight: 600;
  text-align: left;
  padding: 12px 16px;
  border-bottom: 1px solid var(--color-border, #e8e5f0);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.dgj-table td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--color-border, #e8e5f0);
  color: var(--color-text, #1f2b3d);
}
.dgj-table tr:hover td { background: rgba(142,34,148,0.02); }
.dgj-tr-empty td {
  text-align: center;
  color: var(--color-text-secondary, #5b6b82);
  padding: 40px;
}

/* Status Badge */
.dgj-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
}
.dgj-badge-current {
  background: #f3e5f5;
  color: #8e2294;
  border: 1px solid rgba(142,34,148,0.15);
}
.dgj-badge-former {
  background: #f0f0f0;
  color: #888;
  border: 1px solid #e0e0e0;
}

/* Position Tag */
.dgj-pos-tag {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
  background: #F8F7FC;
  color: var(--color-text-secondary, #5b6b82);
  border: 1px solid var(--color-border, #e8e5f0);
}
.dgj-pos-tag.legal { background: #fef3e8; color: #d9730d; border-color: #f2cf9e; }
.dgj-pos-tag.chair { background: #e8f4f8; color: #0e9384; border-color: #9dd6e0; }
.dgj-pos-tag.exec { background: #f0e8f8; color: #7a5af8; border-color: #d4c8f0; }
.dgj-pos-tag.director { background: #e8f0ff; color: #1668dc; border-color: #b9d2f6; }
.dgj-pos-tag.supervisor { background: #fff0f0; color: #c0392b; border-color: #f5c6c6; }
.dgj-pos-tag.gm { background: #e8f8f0; color: #27ae60; border-color: #a8e0c0; }
.dgj-pos-tag.cfo { background: #f8f0e8; color: #8a6d1f; border-color: #e0d4b8; }
.dgj-pos-tag.leader { background: #f0f0f8; color: #5b6b82; border-color: #d8dee8; }

/* Modal */
.dgj-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(31,43,61,0.45);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.dgj-modal-overlay.show { display: flex; }
.dgj-modal {
  background: var(--color-surface, #fff);
  border-radius: 10px;
  box-shadow: 0 8px 32px rgba(31,43,61,0.2);
  width: 100%;
  max-width: 900px;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: dgjModalIn 0.25s ease;
}
@keyframes dgjModalIn {
  from { opacity: 0; transform: scale(0.96) translateY(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.dgj-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--color-border, #e8e5f0);
  background: linear-gradient(135deg, #faf8ff 0%, #f5f0ff 100%);
}
.dgj-modal-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--color-text, #1f2b3d);
  display: flex;
  align-items: center;
  gap: 8px;
}
.dgj-modal-close {
  width: 32px; height: 32px;
  border-radius: 50%; border: none;
  background: #F8F7FC;
  color: var(--color-text-secondary, #5b6b82);
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.dgj-modal-close:hover {
  background: #f3e5f5;
  color: #8e2294;
}
.dgj-modal-body {
  padding: 16px 20px;
  overflow-y: auto;
  flex: 1;
}
.dgj-modal-footer {
  padding: 12px 20px;
  border-top: 1px solid var(--color-border, #e8e5f0);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  background: #F8F7FC;
}

/* Tree in Modal */
.dgj-tree-wrap { font-size: 13px; line-height: 1.7; }
.dgj-tree-node { margin: 2px 0; }
.dgj-tree-row {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 5px 10px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s;
  border: 1px solid transparent;
}
.dgj-tree-row:hover { background: #f3e5f5; }
.dgj-tree-row.highlight {
  background: linear-gradient(135deg, #f3e5f5, #f0e0f5);
  border-color: #8e2294;
  box-shadow: 0 0 0 3px rgba(142,34,148,0.1);
  font-weight: 600;
  color: #6b1a70;
}
.dgj-tree-row.highlight .dgj-tree-name {
  color: #6b1a70;
  font-weight: 700;
}
.dgj-tree-toggle {
  width: 16px; height: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: var(--color-text-secondary, #5b6b82);
  flex-shrink: 0;
}
.dgj-tree-name { font-weight: 500; }
.dgj-tree-pct {
  font-size: 11px;
  color: #8e2294;
  background: rgba(142,34,148,0.08);
  padding: 1px 6px;
  border-radius: 4px;
  font-weight: 600;
}
.dgj-tree-badge {
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 3px;
  font-weight: 500;
}
.dgj-tree-badge.jv { background: #fdf3e7; color: #d9730d; }
.dgj-tree-badge.con { background: #eef4fe; color: #1668dc; }
.dgj-tree-badge.buben { background: #f0f3f8; color: #8a93a6; }
.dgj-tree-children {
  margin-left: 20px;
  padding-left: 14px;
  border-left: 1px solid var(--color-border, #e8e5f0);
}
.dgj-tree-cap {
  font-size: 11px;
  color: var(--color-text-secondary, #5b6b82);
  margin-left: 4px;
}
.dgj-tree-others {
  font-size: 11px;
  color: var(--color-text-secondary, #5b6b82);
  margin: 2px 0 4px 26px;
  padding: 4px 8px;
  background: #F8F7FC;
  border-radius: 6px;
  display: inline-block;
}
.dgj-tree-remark {
  font-size: 11px;
  color: #8a6d1f;
  background: #fffbe8;
  border-left: 2px solid #e6c85c;
  padding: 4px 8px;
  margin: 2px 0 4px 26px;
  border-radius: 0 6px 6px 0;
}
.dgj-tree-toolbar {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--color-border, #e8e5f0);
}
.dgj-tree-toolbar .dgj-btn {
  padding: 5px 12px;
  font-size: 12px;
}

/* Animations */
.dgj-fade-in { animation: dgjFadeIn 0.3s ease; }
@keyframes dgjFadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Scrollbar */
.dgj-select-dropdown::-webkit-scrollbar,
.dgj-modal-body::-webkit-scrollbar {
  width: 6px; height: 6px;
}
.dgj-select-dropdown::-webkit-scrollbar-track,
.dgj-modal-body::-webkit-scrollbar-track { background: transparent; }
.dgj-select-dropdown::-webkit-scrollbar-thumb,
.dgj-modal-body::-webkit-scrollbar-thumb {
  background: #d0c8e0;
  border-radius: 3px;
}

/* Responsive */
@media (max-width: 768px) {
  .dgj-control-row { flex-direction: column; }
  .dgj-select-wrap { width: 100%; }
  .dgj-info-card { flex-direction: column; }
  .dgj-page { padding: 12px; }
  .dgj-table th, .dgj-table td { padding: 10px 12px; }
}
</style>
</head>
<body>

<div id="app-main" class="app-main">
  <div class="dgj-page">

    <!-- 统计栏 -->
    <div class="dgj-stats">
      <div class="dgj-stat-chip">直管子企业 <b>45</b> 家</div>
      <div class="dgj-stat-chip">非直管子企业 <b>37</b> 家</div>
      <div class="dgj-stat-chip">合计 <b>82</b> 家</div>
      <div class="dgj-stat-chip">数据更新至 <b>2026-06-30</b></div>
    </div>

    <!-- 控制面板 -->
    <div class="dgj-control">
      <div class="dgj-control-row">
        <!-- 分类切换 -->
        <div class="dgj-control-group" style="flex:0;">
          <label>企业分类</label>
          <div class="dgj-cat-tabs">
            <button class="dgj-cat-tab active" data-cat="zg" onclick="switchCategory('zg')">直管子企业</button>
            <button class="dgj-cat-tab" data-cat="fzg" onclick="switchCategory('fzg')">非直管子企业</button>
          </div>
        </div>

        <!-- 企业选择器 -->
        <div class="dgj-control-group dgj-select-wrap">
          <label>选择企业</label>
          <input type="text" class="dgj-select-input" id="companySelect" placeholder="请选择或搜索企业…" readonly onclick="toggleDropdown()">
          <span class="dgj-select-arrow">▼</span>
          <div class="dgj-select-dropdown" id="selectDropdown">
            <div class="dgj-select-search">
              <input type="text" id="searchInput" placeholder="搜索企业名称…" oninput="filterOptions()">
            </div>
            <div id="optionsList"></div>
          </div>
        </div>

        <!-- 股权树按钮 -->
        <div class="dgj-control-group" style="flex:0; justify-content: flex-end; padding-top: 20px;">
          <button class="dgj-btn dgj-btn-primary" onclick="openTreeModal()">
            <span>🔗</span> 查看股权结构
          </button>
        </div>
      </div>

      <!-- 公司信息卡 -->
      <div class="dgj-info-card" id="infoCard" style="display:none;">
        <div class="dgj-info-left">
          <div class="dgj-info-name" id="infoName">--</div>
          <div class="dgj-info-tags" id="infoTags"></div>
        </div>
        <div class="dgj-info-right">
          <span style="font-size:12px;color:var(--color-text-secondary,#5b6b82);">法人治理结构：</span>
          <span id="infoGov" style="font-size:13px;font-weight:500;color:var(--color-text,#1f2b3d);">--</span>
        </div>
      </div>
    </div>

    <!-- 董监高列表 -->
    <div class="dgj-fade-in">
      <div class="dgj-tabs-bar">
        <button class="dgj-tab active" onclick="switchTab('current')">现任董监高</button>
        <button class="dgj-tab" onclick="switchTab('former')">历任董监高</button>
      </div>

      <div class="dgj-table-wrap">
        <table class="dgj-table" id="directorsTable">
          <thead>
            <tr>
              <th style="width:60px">序号</th>
              <th>姓名</th>
              <th style="width:150px">职务</th>
              <th style="width:130px">任职起始日</th>
              <th style="width:130px">工商备案日</th>
              <th style="width:100px">状态</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr class="dgj-tr-empty">
              <td colspan="6">请选择企业以查看董监高信息</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<!-- 股权树弹窗 -->
<div class="dgj-modal-overlay" id="treeModal" onclick="closeTreeModal(event)">
  <div class="dgj-modal" onclick="event.stopPropagation()">
    <div class="dgj-modal-header">
      <div class="dgj-modal-title">
        <span style="font-size:18px;">🌳</span>
        <span>力合体系股权架构树</span>
        <span id="modalHighlightName" style="font-size:12px;color:#8e2294;background:#f3e5f5;padding:2px 8px;border-radius:4px;margin-left:8px;display:none;"></span>
      </div>
      <button class="dgj-modal-close" onclick="closeTreeModal()">×</button>
    </div>
    <div class="dgj-modal-body">
      <div class="dgj-tree-toolbar">
        <button class="dgj-btn dgj-btn-ghost" onclick="treeExpandAll(true)">全部展开</button>
        <button class="dgj-btn dgj-btn-ghost" onclick="treeExpandAll(false)">全部收起</button>
        <button class="dgj-btn dgj-btn-ghost" onclick="treeExpandTo(3)">展开至三层</button>
      </div>
      <div class="dgj-tree-wrap" id="treeContainer"></div>
    </div>

// ==================== 状态管理 ====================
let currentCat = 'zg';
let currentCompany = null;
let currentTab = 'current';
let selectedCompanyId = null;
let treeExpanded = new Set();
let dropdownOpen = false;

// ==================== 初始化 ====================
function init() {
  renderLayout('董监高管理', 'dgj');
  renderOptions();
  document.addEventListener('click', function(e) {
    const wrapper = document.querySelector('.dgj-select-wrap');
    if (wrapper && !wrapper.contains(e.target)) closeDropdown();
  });
  // 默认选中第一家，避免空页面
  setTimeout(function() {
    const companies = getCompanies();
    if (companies.length > 0) selectCompany(companies[0].id);
  }, 0);
}

// ==================== 分类切换 ====================
function switchCategory(cat) {
  currentCat = cat;
  currentCompany = null;
  selectedCompanyId = null;
  document.getElementById('companySelect').value = '';
  document.getElementById('infoCard').style.display = 'none';
  document.querySelectorAll('.dgj-cat-tab').forEach(t => t.classList.toggle('active', t.dataset.cat === cat));
  renderOptions();
  renderTable();
}

function getCompanies() {
  return currentCat === 'zg' ? COMPANIES_ZG : COMPANIES_FZG;
}

// ==================== 下拉选择器 ====================
function toggleDropdown() {
  dropdownOpen = !dropdownOpen;
  document.getElementById('selectDropdown').classList.toggle('show', dropdownOpen);
  if (dropdownOpen) {
    document.getElementById('searchInput').value = '';
    filterOptions();
    setTimeout(() => document.getElementById('searchInput').focus(), 50);
  }
}

function closeDropdown() {
  dropdownOpen = false;
  document.getElementById('selectDropdown').classList.remove('show');
}

function renderOptions(filter) {
  const companies = getCompanies();
  const list = document.getElementById('optionsList');
  const filtered = filter ? companies.filter(c => c.name.includes(filter)) : companies;
  if (filtered.length === 0) {
    list.innerHTML = '<div class="dgj-select-empty">未找到匹配企业</div>';
    return;
  }
  list.innerHTML = filtered.map(c => {
    const selected = c.id === selectedCompanyId ? 'selected' : '';
    return '<div class="dgj-select-option ' + selected + '" onclick="selectCompany(' + c.id + ')">' +
      '<span>' + escapeHtml(c.name) + '</span>' +
      '<span class="opt-tag">' + c.level + ' · ' + c.equity + '</span>' +
    '</div>';
  }).join('');
}

function filterOptions() {
  renderOptions(document.getElementById('searchInput').value.trim());
}

function selectCompany(id) {
  const companies = getCompanies();
  const company = companies.find(c => c.id === id);
  if (!company) return;
  selectedCompanyId = id;
  currentCompany = company;
  document.getElementById('companySelect').value = company.name;
  closeDropdown();
  document.getElementById('infoName').textContent = company.name;
  document.getElementById('infoGov').textContent = company.governance || '--';
  const tagsHtml = [
    '<span class="dgj-info-tag">' + company.level + '</span>',
    '<span class="dgj-info-tag">' + company.equity + '</span>',
    company.category ? '<span class="dgj-info-tag secondary">' + company.category + '</span>' : '',
    company.changeType ? '<span class="dgj-info-tag secondary">' + company.changeType + '</span>' : ''
  ].filter(Boolean).join('');
  document.getElementById('infoTags').innerHTML = tagsHtml;
  document.getElementById('infoCard').style.display = 'flex';
  renderTable();
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ==================== Tab切换 ====================
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.dgj-tab').forEach(t => {
    const isCurrent = (tab === 'current' && t.textContent.includes('现任')) ||
                      (tab === 'former' && t.textContent.includes('历任'));
    t.classList.toggle('active', isCurrent);
  });
  renderTable();
}

// ==================== 表格渲染 ====================
function renderTable() {
  const tbody = document.getElementById('tableBody');
  if (!currentCompany) {
    tbody.innerHTML = '<tr class="dgj-tr-empty"><td colspan="6">请选择企业以查看董监高信息</td></tr>';
    return;
  }
  let directors = currentCompany.directors || [];
  if (currentTab === 'current') {
    directors = directors.filter(d => d.status === '现任');
  } else {
    tbody.innerHTML = '<tr class="dgj-tr-empty"><td colspan="6">历任数据后续补录</td></tr>';
    return;
  }
  if (directors.length === 0) {
    tbody.innerHTML = '<tr class="dgj-tr-empty"><td colspan="6">暂无现任董监高记录</td></tr>';
    return;
  }
  const posOrder = {'法人代表':1,'董事长':2,'执行公司事务的董事':3,'董事':4,'监事':5,'总经理':6,'财务负责人':7,'分管领导':8};
  directors.sort((a,b) => (posOrder[a.position]||99) - (posOrder[b.position]||99));
  const posClassMap = {
    '法人代表':'legal','董事长':'chair','执行公司事务的董事':'exec','董事':'director',
    '监事':'supervisor','总经理':'gm','财务负责人':'cfo','分管领导':'leader'
  };
  tbody.innerHTML = directors.map((d, i) => {
    const cls = posClassMap[d.position] || '';
    return '<tr>' +
      '<td>' + (i+1) + '</td>' +
      '<td style="font-weight:500;">' + escapeHtml(d.name) + '</td>' +
      '<td><span class="dgj-pos-tag ' + cls + '">' + d.position + '</span></td>' +
      '<td>' + (d.termStart || '--') + '</td>' +
      '<td>' + (d.termFiling || '--') + '</td>' +
      '<td><span class="dgj-badge dgj-badge-current">● 现任</span></td>' +
    '</tr>';
  }).join('');
}

// ==================== 股权树弹窗 ====================
function openTreeModal() {
  document.getElementById('treeModal').classList.add('show');
  document.body.style.overflow = 'hidden';
  const highlightName = currentCompany ? currentCompany.name : null;
  const el = document.getElementById('modalHighlightName');
  if (highlightName) {
    el.textContent = '当前：' + highlightName;
    el.style.display = 'inline-block';
  } else {
    el.style.display = 'none';
  }
  treeExpanded = new Set();
  if (highlightName) expandToNode(TREE_DATA, highlightName);
  renderTree();
}

function closeTreeModal(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('treeModal').classList.remove('show');
  document.body.style.overflow = '';
}

function expandToNode(nodes, targetName, path) {
  path = path || [];
  for (const node of nodes) {
    if (node.name === targetName) {
      path.forEach(id => treeExpanded.add(id));
      return true;
    }
    if (node.children && node.children.length > 0) {
      const found = expandToNode(node.children, targetName, path.concat(node.id));
      if (found) return true;
    }
  }
  return false;
}

function treeExpandAll(expand) {
  treeExpanded = new Set();
  if (expand) {
    (function walk(ns) {
      ns.forEach(n => { if (n.children && n.children.length) { treeExpanded.add(n.id); walk(n.children); } });
    })(TREE_DATA);
  }
  renderTree();
}

function treeExpandTo(level) {
  treeExpanded = new Set();
  (function walk(ns, depth) {
    ns.forEach(n => { if (depth < level && n.children && n.children.length) { treeExpanded.add(n.id); walk(n.children, depth+1); } });
  })(TREE_DATA, 0);
  renderTree();
}

function renderTree() {
  const container = document.getElementById('treeContainer');
  const highlightName = currentCompany ? currentCompany.name : null;
  container.innerHTML = TREE_DATA.map(n => renderTreeNode(n, highlightName)).join('');
}

function renderTreeNode(node, highlightName) {
  const isHighlight = node.name === highlightName;
  const hasChildren = node.children && node.children.length > 0;
  const isOpen = treeExpanded.has(node.id);
  const badgeType = node.type === 'jv' ? 'jv' : (node.name.includes('本部') ? 'buben' : 'con');
  const badgeText = node.type === 'jv' ? '联合营' : (node.name.includes('本部') ? '本部' : '并表');
  let html = '<div class="dgj-tree-node">';
  html += '<div class="dgj-tree-row ' + (isHighlight ? 'highlight' : '') + '" ' +
    (hasChildren ? 'onclick="toggleTreeNode(' + node.id + ')"' : '') + '>';
  html += '<span class="dgj-tree-toggle">' + (hasChildren ? (isOpen ? '▾' : '▸') : '·') + '</span>';
  html += '<span class="dgj-tree-name">' + escapeHtml(node.name) + '</span>';
  if (node.ratio) html += '<span class="dgj-tree-pct">持股 ' + node.ratio + '</span>';
  html += '<span class="dgj-tree-badge ' + badgeType + '">' + badgeText + '</span>';
  if (node.cap) html += '<span class="dgj-tree-cap">' + node.cap + '</span>';
  html += '</div>';
  if (node.others) html += '<div class="dgj-tree-others">其他股东：' + escapeHtml(node.others) + '</div>';
  if (node.remark) html += '<div class="dgj-tree-remark">' + escapeHtml(node.remark) + '</div>';
  if (hasChildren && isOpen) {
    html += '<div class="dgj-tree-children">';
    node.children.forEach(child => { html += renderTreeNode(child, highlightName); });
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function toggleTreeNode(id) {
  if (treeExpanded.has(id)) treeExpanded.delete(id);
  else treeExpanded.add(id);
  renderTree();
}

// ==================== 延迟启动 ====================
setTimeout(function() {
  init();
}, 0);
</script>
