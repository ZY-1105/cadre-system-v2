<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任免管理 - 力合·人才智库 - 力合科创干部数智平台</title>
  <link rel="stylesheet" href="../css/base.css?v=3">
  <link rel="stylesheet" href="../css/pages-k4.1.css?v=4.1">
  <link rel="stylesheet" href="../css/pages-k4.2.css?v=4.2">
  <style>
    .filter-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }

    .lane-container {
      background: var(--color-surface);
      border-radius: 12px;
      padding: 20px;
      box-shadow: var(--shadow-md);
      overflow-x: auto;
      margin-bottom: 20px;
    }

    .swimlane {
      display: grid;
      grid-template-columns: 100px repeat(12, 1fr);
      gap: 1px;
      min-width: 900px;
      background: var(--color-border);
      border-radius: 8px;
      overflow: hidden;
    }

    .lane-header {
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
      color: #fff;
      padding: 14px 10px;
      font-weight: 600;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .month-header {
      background: #f9f7fb;
      padding: 10px;
      text-align: center;
      font-size: 12px;
      color: #4a4a6a;
      font-weight: 500;
    }

    .lane-row {
      background: #fff;
      padding: 10px;
      min-height: 60px;
      position: relative;
    }

    .lane-label {
      background: #f9f7fb;
      padding: 10px;
      font-size: 13px;
      color: var(--color-text);
      font-weight: 500;
      display: flex;
      align-items: center;
    }

    .lane-node {
      position: absolute;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: transform 0.2s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .lane-node:hover {
      transform: translateY(-2px);
      z-index: 10;
    }

    .lane-node.promote { background: var(--color-accent-light); color: #8a6d1f; border: 1px solid var(--color-accent); }
    .lane-node.transfer { background: #e8f8f5; color: #1abc9c; border: 1px solid #a3e4d7; }
    .lane-node.demote { background: #fdeaea; color: #c0392b; border: 1px solid #f5b7b1; }
    .lane-node.dismiss { background: #eaf5fb; color: #2980b9; border: 1px solid #aed6f1; }

    .appointment-list {
      background: var(--color-surface);
      border-radius: 12px;
      padding: 20px;
      box-shadow: var(--shadow-md);
    }

    .appointment-list-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--color-text);
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 3px solid var(--color-primary);
    }

    .app-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--color-border);
    }

    .app-item:last-child { border-bottom: none; }

    .app-info h4 {
      font-size: 14px;
      color: var(--color-text);
      margin-bottom: 4px;
    }

    .app-info p {
      font-size: 12px;
      color: var(--color-text-secondary);
    }

    @media (max-width: 768px) {
      .lane-container { padding: 12px; }
      .swimlane { min-width: 700px; }
    }
  </style>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="../js/charts.js"></script>
</head>
<body>
  <main class="app-main">
    <div class="filter-bar">
      <select class="form-select" id="typeFilter">
        <option value="">全部类型</option>
        <option value="提拔">提拔</option>
        <option value="平调">平调</option>
        <option value="降职">降职</option>
        <option value="免职">免职</option>
      </select>
      <select class="form-select" id="yearFilter">
        <option value="">全部年份</option>
      </select>
      <input type="text" class="form-input" id="searchInput" placeholder="搜索姓名...">
      <button class="btn btn-primary" id="searchBtn">查询</button>
    </div>

    <div class="lane-container">
      <div class="swimlane" id="swimlane"></div>
    </div>

    <div class="appointment-list">
      <div class="appointment-list-title">最近任免记录</div>
      <div id="appList"></div>
    </div>
  </main>

  <script>

    renderLayout('任免管理', 'appointment');

    let allAppointments = [];
    let filtered = [];
    const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
    const typeMap = { '提拔': 'promote', '平调': 'transfer', '降职': 'demote', '免职': 'dismiss' };

    async function init() {
      allAppointments = await fetchData('appointments');
      allAppointments.sort((a, b) => new Date(b.date) - new Date(a.date));
      filtered = [...allAppointments];

      // 年份
      const years = [...new Set(allAppointments.map(a => new Date(a.date).getFullYear()))].sort((a,b)=>b-a);
      const yearFilter = document.getElementById('yearFilter');
      years.forEach(y => yearFilter.appendChild(new Option(y + '年', y)));

      renderSwimlane();
      renderList();
    }

    function renderSwimlane() {
      const container = document.getElementById('swimlane');
      container.innerHTML = '';

      // 表头
      container.appendChild(Object.assign(document.createElement('div'), { className: 'lane-header', textContent: '类型' }));
      months.forEach(m => {
        container.appendChild(Object.assign(document.createElement('div'), { className: 'month-header', textContent: m }));
      });

      // 泳道
      Object.keys(typeMap).forEach(type => {
        const label = document.createElement('div');
        label.className = 'lane-label';
        label.textContent = type;
        container.appendChild(label);

        const typeItems = filtered.filter(a => a.type === type);

        for (let m = 0; m < 12; m++) {
          const cell = document.createElement('div');
          cell.className = 'lane-row';
          const monthItems = typeItems.filter(a => new Date(a.date).getMonth() === m);
          monthItems.forEach((item, idx) => {
            const node = document.createElement('div');
            node.className = `lane-node ${typeMap[type]}`;
            node.style.top = (8 + idx * 34) + 'px';
            node.style.left = '4px';
            node.style.right = '4px';
            node.textContent = `${item.cadreName}`;
            node.title = `${item.date} ${item.position}`;
            node.addEventListener('click', () => {
              showModal('任免详情', `
                <p><strong>姓名：</strong>${item.cadreName}</p>
                <p><strong>类型：</strong>${item.type}</p>
                <p><strong>职务：</strong>${item.position}</p>
                <p><strong>部门：</strong>${item.department}</p>
                <p><strong>日期：</strong>${formatDate(item.date)}</p>
                <p><strong>审批机构：</strong>${item.approver}</p>
                <p><strong>文号：</strong>${item.documentNo}</p>
                <p><strong>变动说明：</strong>${item.levelChange}</p>
                <p><strong>备注：</strong>${item.note}</p>
              `);
            });
            cell.appendChild(node);
          });
          container.appendChild(cell);
        }
      });
    }

    function renderList() {
      const list = document.getElementById('appList');
      list.innerHTML = '';
      filtered.slice(0, 8).forEach(item => {
        const div = document.createElement('div');
        div.className = 'app-item';
        div.innerHTML = `
          <div class="app-info">
            <h4>${item.type} · ${item.cadreName} · ${item.position}</h4>
            <p>${item.department} · ${formatDate(item.date)} · ${item.approver} · ${item.documentNo}</p>
          </div>
          <span class="badge ${item.status === '已生效' ? 'badge-success' : item.status === '预警' ? 'badge-warning' : 'badge-primary'}">${item.status}</span>
        `;
        list.appendChild(div);
      });
    }

    function doFilter() {
      const type = document.getElementById('typeFilter').value;
      const year = document.getElementById('yearFilter').value;
      const keyword = document.getElementById('searchInput').value.trim();

      filtered = allAppointments.filter(a => {
        return (!type || a.type === type) &&
               (!year || new Date(a.date).getFullYear() === parseInt(year)) &&
               (!keyword || a.cadreName.includes(keyword));
      });

      renderSwimlane();
      renderList();
    }

    document.getElementById('searchBtn').addEventListener('click', doFilter);
    document.getElementById('typeFilter').addEventListener('change', doFilter);
    document.getElementById('yearFilter').addEventListener('change', doFilter);
    document.getElementById('searchInput').addEventListener('input', debounce(doFilter, 300));

    init();
  </script>
</body>
</html>
