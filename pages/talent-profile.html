<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人才画像 - 力合·人才智库</title>
  <link rel="stylesheet" href="../css/base-k3.css">
  <link rel="stylesheet" href="../css/pages-k4.2-extra.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
  <script src="../js/app-k3.js"></script>
  <script>renderLayout('人才画像', 'talent-review');</script>

  <main class="app-main">
    <div class="tp-container">

      <!-- 返回按钮 -->
      <a href="talent-review.html" class="tp-back">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        返回人才盘点
      </a>

      <!-- ① 头部：基础信息区 -->
      <div class="tp-header" id="tp-header"></div>

      <!-- ② 九宫格定位区 -->
      <div class="tp-section">
        <div class="tp-section-title">人才九宫格定位</div>
        <div class="tp-nine-grid" id="tp-nine-grid"></div>
        <div class="tp-score-bar" id="tp-score-bar"></div>
      </div>

      <!-- ③ 能力分析区 -->
      <div class="tp-section">
        <div class="tp-section-title">能力分析</div>
        <div class="tp-charts" id="tp-charts"></div>
      </div>

    </div>
  </main>

  <script>
  /* ============================================================
     人才画像详情页 — 接收 id 参数，动态加载干部数据
     ============================================================ */

  const GRID_LABELS = [
    '潜力新星', '中坚力量', '核心人才',
    '差距员工', '稳定贡献', '中坚力量',
    '差距员工', '差距员工', '稳定贡献'
  ];

  const DEFAULT_THRESHOLDS = {
    performance: { high: 8.0, medium: 4.0 },
    potential:   { high: 8.0, medium: 4.0 }
  };

  /* ---------- 工具 ---------- */
  function getCadreId() {
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    return id ? parseInt(id) : 1;
  }

  /* ---------- 数据层 ---------- */
  async function fetchData() {
    await new Promise(r => setTimeout(r, 60));
    return {
      thresholds: { ...DEFAULT_THRESHOLDS },
      cadres: [
        { id: 1,  name: '张某某', dept: '投资管理部',   title: '部长',       level: '中层正职', entryDate: '2015-03', age: 42, evaluated: true,  scores: { professional: 8.0, management: 7.0, potential: 9.0, impression: 8.5 }, bizTags: ['达轮岗年限'], performanceTrend: [{year:'2023',score:7.2},{year:'2024',score:7.8},{year:'2025',score:8.5}] },
        { id: 2,  name: '李某',   dept: '投资管理部',   title: '副部长',     level: '中层副职', entryDate: '2018-06', age: 38, evaluated: true,  scores: { professional: 7.0, management: 6.0, potential: 8.0, impression: 7.0 }, bizTags: ['副职储备'], performanceTrend: [{year:'2023',score:6.5},{year:'2024',score:7.0},{year:'2025',score:7.5}] },
        { id: 3,  name: '赵某某', dept: '战略发展部',   title: '部长',       level: '中层正职', entryDate: '2012-09', age: 45, evaluated: true,  scores: { professional: 9.0, management: 9.0, potential: 8.0, impression: 9.0 }, bizTags: ['领导班子后备'], performanceTrend: [{year:'2023',score:8.5},{year:'2024',score:8.8},{year:'2025',score:9.0}] },
        { id: 4,  name: '钱某',   dept: '战略发展部',   title: '副部长',     level: '中层副职', entryDate: '2019-01', age: 35, evaluated: true,  scores: { professional: 6.0, management: 5.0, potential: 6.0, impression: 5.5 }, bizTags: [], performanceTrend: [{year:'2023',score:5.5},{year:'2024',score:6.0},{year:'2025',score:6.2}] },
        { id: 5,  name: '吴某某', dept: '党群工作部',   title: '部长（兼）', level: '领导班子', entryDate: '2010-05', age: 48, evaluated: true,  scores: { professional: 9.0, management: 8.0, potential: 9.0, impression: 9.0 }, bizTags: ['兼职兼任'], performanceTrend: [{year:'2023',score:8.8},{year:'2024',score:9.0},{year:'2025',score:9.2}] },
        { id: 6,  name: '郑某',   dept: '党群工作部',   title: '副部长',     level: '中层副职', entryDate: '2017-11', age: 41, evaluated: true,  scores: { professional: 5.0, management: 4.0, potential: 7.0, impression: 5.0 }, bizTags: [], performanceTrend: [{year:'2023',score:4.5},{year:'2024',score:5.0},{year:'2025',score:5.5}] },
        { id: 7,  name: '陈某',   dept: '财务部',       title: '部长',       level: '中层正职', entryDate: '2014-08', age: 44, evaluated: true,  scores: { professional: 4.0, management: 3.0, potential: 5.0, impression: 4.0 }, bizTags: [], performanceTrend: [{year:'2023',score:4.0},{year:'2024',score:4.2},{year:'2025',score:4.5}] },
        { id: 8,  name: '冯某',   dept: '财务部',       title: '副部长',     level: '中层副职', entryDate: '2020-02', age: 33, evaluated: true,  scores: { professional: 6.0, management: 6.0, potential: 5.0, impression: 6.0 }, bizTags: [], performanceTrend: [{year:'2023',score:5.8},{year:'2024',score:6.0},{year:'2025',score:6.5}] },
        { id: 9,  name: '褚某',   dept: '风险合规部',   title: '部长',       level: '中层正职', entryDate: '2016-07', age: 40, evaluated: true,  scores: { professional: 6.0, management: 5.0, potential: 5.0, impression: 5.5 }, bizTags: [], performanceTrend: [{year:'2023',score:5.5},{year:'2024',score:6.0},{year:'2025',score:6.2}] },
        { id: 10, name: '卫某',   dept: '风险合规部',   title: '副部长',     level: '中层副职', entryDate: '2021-04', age: 30, evaluated: true,  scores: { professional: 5.0, management: 5.0, potential: 4.0, impression: 4.5 }, bizTags: [], performanceTrend: [{year:'2023',score:4.5},{year:'2024',score:5.0},{year:'2025',score:5.2}] },
        { id: 11, name: '蒋某',   dept: '投资管理部',   title: '高级经理',   level: '基层干部', entryDate: '2019-09', age: 29, evaluated: true,  scores: { professional: 7.0, management: 7.0, potential: 6.0, impression: 7.0 }, bizTags: [], performanceTrend: [{year:'2023',score:6.5},{year:'2024',score:7.0},{year:'2025',score:7.2}] },
        { id: 12, name: '沈某',   dept: '战略发展部',   title: '高级经理',   level: '基层干部', entryDate: '2020-01', age: 31, evaluated: true,  scores: { professional: 6.0, management: 6.0, potential: 5.0, impression: 6.0 }, bizTags: [], performanceTrend: [{year:'2023',score:5.5},{year:'2024',score:6.0},{year:'2025',score:6.5}] },
        { id: 13, name: '韩某',   dept: '财务部',       title: '高级经理',   level: '基层干部', entryDate: '2018-03', age: 36, evaluated: true,  scores: { professional: 3.0, management: 2.0, potential: 3.0, impression: 2.5 }, bizTags: ['待观察'], performanceTrend: [{year:'2023',score:3.0},{year:'2024',score:3.2},{year:'2025',score:3.5}] },
        { id: 14, name: '杨某',   dept: '风险合规部',   title: '高级经理',   level: '基层干部', entryDate: '2022-06', age: 27, evaluated: false, scores: null, bizTags: [], performanceTrend: [] },
        { id: 15, name: '朱某',   dept: '投资管理部',   title: '经理',       level: '基层干部', entryDate: '2023-01', age: 26, evaluated: false, scores: null, bizTags: [], performanceTrend: [] },
        { id: 16, name: '秦某',   dept: '战略发展部',   title: '经理',       level: '基层干部', entryDate: '2023-08', age: 25, evaluated: false, scores: null, bizTags: [], performanceTrend: [] }
      ]
    };
  }

  /* ============================================================
     计算引擎（纯函数）
     ============================================================ */

  function computeGridState(cadre, thresholds) {
    if (!cadre.evaluated || cadre.scores == null) {
      return { state: 'PENDING', label: '待评估' };
    }
    const scores = cadre.scores;
    const vals = [scores.professional, scores.management, scores.potential, scores.impression];
    const allMax = vals.every(v => v >= 9.9);
    const allMin = vals.every(v => v <= 1.1);
    if (allMax || allMin) {
      return { state: 'ANOMALY', label: '数据异常' };
    }
    const performance = parseFloat(((scores.professional * 0.4 + scores.management * 0.3) / 0.7).toFixed(1));
    const potential   = parseFloat(scores.potential.toFixed(1));
    const impression  = parseFloat(scores.impression.toFixed(1));
    const getLevel = (score, th) => {
      if (score >= th.high)    return 'high';
      if (score >= th.medium)  return 'medium';
      return 'low';
    };
    const xLevel = getLevel(performance, thresholds.performance);
    const yLevel = getLevel(potential,   thresholds.potential);
    const yMap = { high: 0, medium: 1, low: 2 };
    const xMap = { low: 0, medium: 1, high: 2 };
    const index = yMap[yLevel] * 3 + xMap[xLevel];
    return { state: 'NORMAL', index, label: GRID_LABELS[index], performance, potential, impression };
  }

  function generateTags(cadre, gridState) {
    const tags = [];
    tags.push({ text: gridState.label, type: 'cat' });
    if (gridState.state === 'NORMAL') {
      if (gridState.potential >= 8.0)   tags.push({ text: '高潜', type: 'green' });
      if (gridState.performance >= 8.0) tags.push({ text: '高绩效', type: 'green' });
    }
    if (Array.isArray(cadre.bizTags)) {
      cadre.bizTags.forEach(t => tags.push({ text: t, type: 'orange' }));
    }
    return tags;
  }

  /* ============================================================
     渲染引擎
     ============================================================ */

  function renderHeader(cadre, tags) {
    document.getElementById('tp-header').innerHTML = `
      <div class="tp-avatar">${cadre.name[0]}</div>
      <div class="tp-header-info">
        <div class="tp-name-row">
          <h1 class="tp-name">${cadre.name}</h1>
          <span class="tp-level">${cadre.level}</span>
        </div>
        <div class="tp-meta-row">
          <span>${cadre.title}</span>
          <span class="tp-meta-dot">·</span>
          <span>${cadre.dept}</span>
          <span class="tp-meta-dot">·</span>
          <span>入职 ${cadre.entryDate}</span>
        </div>
        <div class="tp-tags">
          ${tags.map(t => `<span class="tp-tag tp-tag--${t.type}">${t.text}</span>`).join('')}
        </div>
      </div>
    `;
  }

  function renderGrid(gridState) {
    const el = document.getElementById('tp-nine-grid');
    if (gridState.state === 'PENDING') {
      el.innerHTML = '<div class="tp-grid-empty">该干部尚未完成评价，暂无九宫格定位</div>';
      return;
    }
    if (gridState.state === 'ANOMALY') {
      el.innerHTML = '<div class="tp-grid-empty tp-grid-empty--error">⚠ 评分数据异常（四维度全满或全低）</div>';
      return;
    }
    const activeIdx = gridState.index;
    el.innerHTML = GRID_LABELS.map((label, idx) => {
      const isActive = idx === activeIdx;
      const row = Math.floor(idx / 3);
      const col = idx % 3;
      const yLabel = row === 0 ? '高潜' : row === 1 ? '中潜' : '低潜';
      const xLabel = col === 0 ? '低绩' : col === 1 ? '中绩' : '高绩';
      return `
        <div class="tp-grid-cell ${isActive ? 'tp-grid-cell--active' : ''}">
          ${isActive ? '<div class="tp-grid-pin">当前位置</div>' : ''}
          <div class="tp-grid-label">${label}</div>
          <div class="tp-grid-axis">${yLabel} · ${xLabel}</div>
        </div>
      `;
    }).join('');
  }

  function renderScoreBar(gridState) {
    const el = document.getElementById('tp-score-bar');
    if (gridState.state !== 'NORMAL') {
      el.style.display = 'none';
      return;
    }
    el.style.display = 'block';
    el.innerHTML = `
      <div class="tp-score-row">
        <div class="tp-score-piece"><span>综合绩效分</span><strong>${gridState.performance}</strong></div>
        <div class="tp-score-piece"><span>发展潜力分</span><strong>${gridState.potential}</strong></div>
        <div class="tp-score-piece"><span>综合印象分</span><strong class="tp-score-impression">${gridState.impression}</strong></div>
      </div>
      <div class="tp-score-formula">综合绩效分 = (专业能力×40% + 管理能力×30%) ÷ 0.7 · 发展潜力分直接取值 · 印象分用于同分排序</div>
    `;
  }

  /* ============================================================
     ECharts 图表渲染 — 绩效趋势 + 能力雷达图
     ============================================================ */

  function renderCharts(cadre, allCadres) {
    const container = document.getElementById('tp-charts');
    container.innerHTML = `
      <div class="tp-chart-card">
        <div class="tp-chart-title">近三年绩效趋势</div>
        <div class="tp-chart-body" id="chart-performance" style="height:200px;"></div>
      </div>
      <div class="tp-chart-card">
        <div class="tp-chart-title">能力维度雷达图</div>
        <div class="tp-chart-body" id="chart-radar" style="height:200px;"></div>
      </div>
    `;

    // 1. 折线图：近三年绩效趋势
    const perfData = cadre.performanceTrend || [];
    if (perfData.length > 0) {
      const perfChart = echarts.init(document.getElementById('chart-performance'));
      const years = perfData.map(d => d.year);
      const scores = perfData.map(d => d.score);
      perfChart.setOption({
        grid: { top: 30, right: 20, bottom: 25, left: 40 },
        xAxis: {
          type: 'category',
          data: years,
          axisLine: { lineStyle: { color: 'rgba(0,0,0,0.1)' } },
          axisLabel: { color: 'rgba(0,0,0,0.5)', fontSize: 12 },
          axisTick: { show: false }
        },
        yAxis: {
          type: 'value',
          min: 1,
          max: 10,
          splitLine: { lineStyle: { color: 'rgba(0,0,0,0.04)' } },
          axisLabel: { color: 'rgba(0,0,0,0.5)', fontSize: 12 }
        },
        series: [{
          data: scores,
          type: 'line',
          smooth: true,
          symbol: 'circle',
          symbolSize: 8,
          lineStyle: { color: '#8e2294', width: 2.5 },
          itemStyle: { color: '#8e2294', borderWidth: 2, borderColor: '#fff' },
          areaStyle: {
            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
              { offset: 0, color: 'rgba(142,34,148,0.25)' },
              { offset: 1, color: 'rgba(142,34,148,0.02)' }
            ])
          },
          label: {
            show: true,
            position: 'top',
            color: '#8e2294',
            fontSize: 12,
            fontWeight: 600,
            formatter: '{c}'
          }
        }],
        tooltip: {
          trigger: 'axis',
          backgroundColor: 'rgba(255,255,255,0.95)',
          borderColor: 'rgba(142,34,148,0.15)',
          textStyle: { color: '#1a1a2e', fontSize: 12 },
          formatter: p => `${p[0].name}年<br/>绩效分: <strong style="color:#8e2294">${p[0].value}</strong>`
        }
      });
    }

    // 2. 雷达图：能力维度分析
    if (cadre.scores) {
      const radarChart = echarts.init(document.getElementById('chart-radar'));
      const s = cadre.scores;
      // 计算同层级平均分
      const sameLevel = allCadres.filter(c => c.level === cadre.level && c.scores);
      const avgScores = {
        professional: sameLevel.length ? (sameLevel.reduce((sum, c) => sum + c.scores.professional, 0) / sameLevel.length).toFixed(1) : 5,
        management: sameLevel.length ? (sameLevel.reduce((sum, c) => sum + c.scores.management, 0) / sameLevel.length).toFixed(1) : 5,
        potential: sameLevel.length ? (sameLevel.reduce((sum, c) => sum + c.scores.potential, 0) / sameLevel.length).toFixed(1) : 5,
        impression: sameLevel.length ? (sameLevel.reduce((sum, c) => sum + c.scores.impression, 0) / sameLevel.length).toFixed(1) : 5,
      };

      radarChart.setOption({
        tooltip: {
          backgroundColor: 'rgba(255,255,255,0.95)',
          borderColor: 'rgba(142,34,148,0.15)',
          textStyle: { color: '#1a1a2e', fontSize: 12 }
        },
        legend: {
          data: ['当前干部', '同层级平均'],
          bottom: 0,
          textStyle: { color: 'rgba(0,0,0,0.6)', fontSize: 12 }
        },
        radar: {
          indicator: [
            { name: '专业能力', max: 10 },
            { name: '管理能力', max: 10 },
            { name: '发展潜力', max: 10 },
            { name: '综合印象', max: 10 }
          ],
          shape: 'polygon',
          splitNumber: 5,
          axisName: { color: 'rgba(0,0,0,0.6)', fontSize: 12 },
          splitLine: { lineStyle: { color: 'rgba(0,0,0,0.06)' } },
          splitArea: { show: true, areaStyle: { color: ['rgba(142,34,148,0.02)', 'rgba(142,34,148,0.04)', 'rgba(142,34,148,0.06)', 'rgba(142,34,148,0.08)', 'rgba(142,34,148,0.10)'] } },
          axisLine: { lineStyle: { color: 'rgba(0,0,0,0.1)' } }
        },
        series: [{
          type: 'radar',
          data: [
            {
              value: [s.professional, s.management, s.potential, s.impression],
              name: '当前干部',
              lineStyle: { color: '#8e2294', width: 2 },
              itemStyle: { color: '#8e2294' },
              areaStyle: { color: 'rgba(142,34,148,0.15)' },
              symbol: 'circle',
              symbolSize: 6
            },
            {
              value: [avgScores.professional, avgScores.management, avgScores.potential, avgScores.impression],
              name: '同层级平均',
              lineStyle: { color: 'rgba(0,0,0,0.25)', width: 1.5, type: 'dashed' },
              itemStyle: { color: 'rgba(0,0,0,0.3)' },
              areaStyle: { color: 'rgba(0,0,0,0.03)' },
              symbol: 'circle',
              symbolSize: 4
            }
          ]
        }]
      });
    }

    // 响应式重绘
    window.addEventListener('resize', () => {
      perfData.length > 0 && perfChart.resize();
      cadre.scores && radarChart.resize();
    });
  }

  /* ============================================================
     初始化 — 根据 URL id 加载对应干部
     ============================================================ */

  async function init() {
    const data = await fetchData();
    const cadreId = getCadreId();
    const cadre = data.cadres.find(c => c.id === cadreId);

    if (!cadre) {
      document.querySelector('.tp-container').innerHTML = `
        <div style="text-align:center;padding:80px 20px;">
          <div style="font-size:48px;margin-bottom:16px;">🔍</div>
          <div style="font-size:18px;font-weight:600;color:var(--color-text);margin-bottom:8px;">未找到该干部信息</div>
          <div style="font-size:14px;color:var(--color-text-tertiary);">ID: ${cadreId}</div>
          <a href="talent-review.html" class="tp-back" style="margin-top:24px;display:inline-flex;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
            返回人才盘点
          </a>
        </div>
      `;
      return;
    }

    const gridState = computeGridState(cadre, data.thresholds);
    const tags = generateTags(cadre, gridState);

    renderHeader(cadre, tags);
    renderGrid(gridState);
    renderScoreBar(gridState);
    renderCharts(cadre, data.cadres);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
  </script>
</body>
</html>
