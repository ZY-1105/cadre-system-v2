<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>档案管理 - 力合·人才智库 - 力合科创干部数智平台</title>
  <link rel="stylesheet" href="../css/base.css?v=3">
  <link rel="stylesheet" href="../css/pages-k4.1.css?v=4.1">
  <link rel="stylesheet" href="../css/pages-k4.2.css?v=4.2">
  <link rel="stylesheet" href="../css/pages-k4.2-extra.css">
  <style>
    .doc-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .doc-info {
      flex: 1;
      min-width: 0;
    }

    .doc-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--color-text);
      margin-bottom: 2px;
    }

    .doc-meta {
      font-size: 12px;
      color: var(--color-text-secondary);
    }
      .doc-actions {
      display: flex;
      gap: 8px;
    }
  </style>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="../js/charts.js"></script>
</head>
<body>
  <main class="app-main">
    <div class="archive-tabs" id="archiveTabs">
      <div class="archive-tab active" data-type="personnel">人事档案</div>
      <div class="archive-tab" data-type="appointment">任免文件</div>
      <div class="archive-tab" data-type="assessment">考核材料</div>
      <div class="archive-tab" data-type="training">培训记录</div>
    </div>

    <div class="archive-content">
      <div class="doc-list" id="docList"></div>
    </div>
  </main>

  <script>

    renderLayout('档案管理', 'archive');

    const archives = {
      personnel: [
        { name: '张明远_干部履历表.pdf', date: '2024-06-15', size: '2.3 MB', type: 'pdf' },
        { name: '李淑华_干部任免审批表.docx', date: '2024-06-12', size: '856 KB', type: 'doc' },
        { name: '王建国_个人有关事项报告.pdf', date: '2024-05-28', size: '1.8 MB', type: 'pdf' },
        { name: '陈晓东_学历学位证书.jpg', date: '2024-05-20', size: '3.1 MB', type: 'img' },
        { name: '刘雅琴_培训结业证书.pdf', date: '2024-05-10', size: '1.2 MB', type: 'pdf' }
      ],
      appointment: [
        { name: '力合党〔2024〕12号_关于王建国同志免职的通知.pdf', date: '2024-11-20', size: '1.5 MB', type: 'pdf' },
        { name: '力合党〔2023〕5号_关于吴美玲同志任职的通知.pdf', date: '2023-02-15', size: '1.3 MB', type: 'pdf' },
        { name: '力合人〔2024〕8号_关于罗嘉欣同志转正的通知.pdf', date: '2024-07-10', size: '980 KB', type: 'pdf' }
      ],
      assessment: [
        { name: '2023年度干部考核汇总表.xlsx', date: '2024-01-15', size: '1.2 MB', type: 'xls' },
        { name: '张明远_2023年度述职述廉报告.pdf', date: '2024-01-10', size: '2.1 MB', type: 'pdf' },
        { name: '李淑华_2023年度民主测评结果.pdf', date: '2024-01-08', size: '1.6 MB', type: 'pdf' }
      ],
      training: [
        { name: '2024年干部能力提升培训班花名册.xlsx', date: '2024-06-01', size: '850 KB', type: 'xls' },
        { name: '刘雅琴_清华大学高级研修班结业证书.pdf', date: '2024-05-15', size: '2.0 MB', type: 'pdf' }
      ]
    };

    const typeIcon = { pdf: '📕', doc: '📘', xls: '📗', img: '🖼️' };

    function renderDocs(type) {
      const list = document.getElementById('docList');
      list.innerHTML = '';
      archives[type].forEach(doc => {
        const item = document.createElement('div');
        item.className = 'doc-item';
        item.innerHTML = `
          <div class="doc-icon ${doc.type}">${typeIcon[doc.type]}</div>
          <div class="doc-info">
            <div class="doc-name">${doc.name}</div>
            <div class="doc-meta">${doc.date} · ${doc.size}</div>
          </div>
          <div class="doc-actions">
            <button class="doc-btn">预览</button>
            <button class="doc-btn primary">下载</button>
          </div>
        `;
        list.appendChild(item);
      });
    }

    document.querySelectorAll('.archive-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.archive-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        renderDocs(tab.dataset.type);
      });
    });

    renderDocs('personnel');
  </script>
</body>
</html>
