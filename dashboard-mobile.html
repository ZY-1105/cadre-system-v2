<style>
:root {
  --color-primary: #8e2294;
  --color-primary-dark: #6b1a70;
  --color-primary-light: #a855a8;
  --color-accent: #F8C24C;
  --color-accent-light: #fdecc8;
  --color-bg: #f5f3f7;
  --color-surface: #ffffff;
  --color-text: #1a1a2e;
  --color-text-secondary: #4a4a6a;
  --color-border: #e8e0ec;
  --color-success: #27ae60;
  --color-warning: #e67e22;
  --color-danger: #c0392b;
  --color-danger-bg: #fbe9e7;
  --font-family: "PingFang SC","Microsoft YaHei",sans-serif;
  --header-height: 56px;
  --shadow-md: 0 4px 12px rgba(90,20,126,0.08);
  --radius-lg: 12px;
  --radius-md: 8px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:var(--font-family);font-size:14px;color:var(--color-text);background:var(--color-bg)}
a{text-decoration:none;color:inherit}
button{font-family:inherit}
/* Header */
.app-header{position:fixed;top:0;left:0;right:0;height:var(--header-height);background:linear-gradient(135deg,var(--color-primary)0%,var(--color-primary-dark)100%);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-shadow:var(--shadow-md);z-index:1000}
.header-brand{display:flex;align-items:center;gap:10px}
.brand-icon{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.brand-text-wrap{display:flex;flex-direction:column;justify-content:center}
.brand-text{font-size:16px;font-weight:700;letter-spacing:1px;line-height:1.2}
.brand-subtitle{font-size:11px;opacity:0.9;letter-spacing:0.5px;margin-top:1px}
.page-title{display:none}
.header-actions{display:flex;align-items:center;gap:10px}
.user-info{display:flex;align-items:center;gap:8px}
.user-name{font-size:13px;display:none}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--color-accent);color:#1a1a2e;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
/* Main */
.app-main{margin-top:var(--header-height);padding:12px;min-height:calc(100vh - var(--header-height))}
/* Stat Cards */
.stat-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat-card{background:var(--color-surface);border-radius:var(--radius-lg);padding:14px 16px;box-shadow:var(--shadow-md);display:flex;flex-direction:column;gap:4px;border-top:3px solid var(--color-primary)}
.stat-card.accent{border-top-color:var(--color-accent)}
.stat-label{font-size:12px;color:var(--color-text-secondary)}
.stat-value{font-size:26px;font-weight:700;color:var(--color-primary)}
.stat-value.accent{color:var(--color-text)}
/* Charts */
.charts-row{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
.chart-card{background:var(--color-surface);border-radius:var(--radius-lg);padding:14px;box-shadow:var(--shadow-md)}
.chart-card-title{font-size:14px;font-weight:600;color:var(--color-text);margin-bottom:10px;padding-bottom:8px;border-bottom:3px solid var(--color-primary)}
.chart-card-title.accent{border-bottom-color:var(--color-accent)}
.chart-container{display:flex;justify-content:center;align-items:center;min-height:200px;width:100%}
.chart-container svg{max-width:100%;height:auto}
/* Dashboard Grid */
.dashboard-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
/* Alert */
.alert-list{display:flex;flex-direction:column;gap:8px}
.alert-item{display:flex;align-items:flex-start;gap:10px;padding:12px;background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(142,34,148,0.06)}
.alert-item.high{border-left:4px solid var(--color-danger)}
.alert-item.medium{border-left:4px solid var(--color-accent)}
.alert-item.low{border-left:3px solid var(--color-border)}
.alert-icon{width:32px;height:32px;border-radius:50%;background:var(--color-accent-light);color:#8a6d1f;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.alert-icon.high{background:var(--color-danger-bg);color:var(--color-danger)}
.alert-content{flex:1}
.alert-title{font-weight:600;font-size:13px;color:var(--color-text);margin-bottom:2px}
.alert-desc{font-size:11px;color:var(--color-text-secondary);line-height:1.4}
.alert-days{font-size:11px;font-weight:600;white-space:nowrap}
.alert-days.high{color:var(--color-danger)}
.alert-days.medium{color:#8a6d1f}
.alert-days.low{color:var(--color-text-secondary)}
/* Bottom Section */
.bottom-section{margin-top:12px}
.quick-entry{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.quick-card{background:linear-gradient(135deg,rgba(142,34,148,0.08),rgba(142,34,148,0.02));border:1px solid var(--color-border);border-radius:10px;padding:12px 8px;text-align:center;cursor:pointer;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:6px}
.quick-card:hover{border-color:var(--color-primary);box-shadow:0 4px 12px rgba(142,34,148,0.12)}
.quick-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--color-primary),var(--color-primary-dark));color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.quick-label{font-size:12px;color:var(--color-text);font-weight:500}
/* Footer */
.app-footer{text-align:center;padding:16px;font-size:11px;color:var(--color-text-secondary);border-top:1px solid var(--color-border);margin-top:16px}
/* Tooltip */
#chart-tooltip{position:fixed;background:rgba(26,26,46,0.95);color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;pointer-events:none;z-index:9999;opacity:0;transition:opacity 0.2s;box-shadow:0 4px 16px rgba(142,34,148,0.3);border:1px solid var(--color-primary);max-width:200px;line-height:1.5}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(26,26,46,0.6);display:flex;align-items:center;justify-content:center;z-index:2000;opacity:0;visibility:hidden;transition:all 0.25s}
.modal-overlay.active{opacity:1;visibility:visible}
.modal{background:var(--color-surface);border-radius:var(--radius-lg);padding:20px;max-width:90%;width:400px;max-height:80vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,0.2);transform:scale(0.95);transition:transform 0.25s}
.modal-overlay.active .modal{transform:scale(1)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:2px solid var(--color-border)}
.modal-title{font-size:16px;font-weight:600;color:var(--color-text)}
.modal-close{background:none;border:none;font-size:22px;color:var(--color-text-secondary);cursor:pointer;padding:0 4px}
.modal-body{font-size:13px;color:var(--color-text-secondary)}
.people-list{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.people-item{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--color-bg);border-radius:8px;font-size:13px}
.people-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--color-primary),var(--color-primary-dark));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex-shrink:0}
.people-info{flex:1}
.people-name{font-weight:500;color:var(--color-text);font-size:13px}
.people-dept{font-size:11px;color:var(--color-text-secondary)}
.people-score{font-size:12px;color:var(--color-primary);font-weight:600}
/* Tablet+ */
@media(min-width:768px){
  .app-header{padding:0 24px;--header-height:64px}
  .brand-text{font-size:20px}
  .brand-subtitle{font-size:12px}
  .page-title{display:block;font-size:13px;opacity:0.9;margin-left:12px;padding-left:12px;border-left:1px solid rgba(255,255,255,0.3)}
  .user-name{display:inline}
  .app-main{padding:20px}
  .stat-cards{grid-template-columns:repeat(4,1fr);gap:16px}
  .stat-card{padding:18px 20px;gap:6px;border-top:4px solid var(--color-primary)}
  .stat-value{font-size:32px}
  .charts-row{grid-template-columns:repeat(3,1fr);gap:16px}
  .chart-card{padding:18px}
  .chart-container{min-height:240px}
  .dashboard-grid{grid-template-columns:2fr 1fr;gap:16px}
  .quick-entry{gap:10px}
  .quick-card{padding:14px 12px}
  .quick-icon{width:40px;height:40px}
  .quick-label{font-size:13px}
}
@media(min-width:1024px){
  .app-main{padding:24px}
  .stat-cards{gap:20px}
  .charts-row{gap:20px}
  .dashboard-grid{gap:20px}
}
</style>
</head>

const BRAND_COLORS = {primary:'#8e2294',primaryDark:'#6b1a70',primaryLight:'#a855a8',accent:'#F8C24C',accentLight:'#fdecc8',bg:'#f5f3f7',surface:'#ffffff',text:'#1a1a2e',textSecondary:'#4a4a6a',border:'#e8e0ec',success:'#27ae60',warning:'#e67e22',danger:'#c0392b'};

function showModal(title,contentHTML){
  const overlay=document.getElementById('modalOverlay');
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalBody').innerHTML=contentHTML;
  overlay.classList.add('active');
  document.getElementById('modalClose').onclick=()=>overlay.classList.remove('active');
  overlay.onclick=(e)=>{if(e.target===overlay)overlay.classList.remove('active')};
}

// ===== charts.js =====
function createSVGElement(tag,attrs={}){
  const el=document.createElementNS('http://www.w3.org/2000/svg',tag);
  Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));
  return el;
}
function getTooltip(){
  let t=document.getElementById('chart-tooltip');
  if(!t){t=document.createElement('div');t.id='chart-tooltip';document.body.appendChild(t)}
  return t;
}
function showTooltip(e,html){
  const t=getTooltip();t.innerHTML=html;t.style.opacity='1';
  t.style.left=Math.min(e.clientX+12,window.innerWidth-220)+'px';
  t.style.top=Math.min(e.clientY-12,window.innerHeight-60)+'px';
}
function hideTooltip(){const t=getTooltip();if(t)t.style.opacity='0'}

const PURPLE_GRADIENTS=[['#8e2294','#6b1a70'],['#a855a8','#8e2294'],['#c77dc8','#a855a8'],['#6b1a70','#4a124d'],['#9b59b6','#7d3c98'],['#8e44ad','#6c3483']];

// 饼图
function renderPieChart(containerId,data,options={}){
  const container=document.getElementById(containerId);if(!container)return;
  container.innerHTML='';
  const w=container.clientWidth||options.width||300;
  const h=Math.min(w,options.height||300);
  const r=Math.min(w,h)/2-40;const cx=w/2,cy=h/2;
  const total=data.reduce((s,d)=>s+d.value,0);
  if(total===0){container.innerHTML='<div style="color:#4a4a6a;padding:40px;text-align:center">暂无数据</div>';return}
  let curAngle=-Math.PI/2;
  const svg=createSVGElement('svg',{width:w,height:h,viewBox:`0 0 ${w} ${h}`});
  const defs=createSVGElement('defs');svg.appendChild(defs);
  data.forEach((_,i)=>{
    const g=createSVGElement('linearGradient',{id:`pieG-${containerId}-${i}`,x1:'0%',y1:'0%',x2:'100%',y2:'100%'});
    const [c1,c2]=PURPLE_GRADIENTS[i%PURPLE_GRADIENTS.length];
    g.appendChild(createSVGElement('stop',{offset:'0%','stop-color':c1}));
    g.appendChild(createSVGElement('stop',{offset:'100%','stop-color':c2}));defs.appendChild(g);
  });
  data.forEach((item,i)=>{
    const angle=(item.value/total)*2*Math.PI;const endAngle=curAngle+angle;
    const x1=cx+r*Math.cos(curAngle),y1=cy+r*Math.sin(curAngle);
    const x2=cx+r*Math.cos(endAngle),y2=cy+r*Math.sin(endAngle);
    const largeArc=angle>Math.PI?1:0;
    const path=createSVGElement('path',{d:`M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} Z`,fill:`url(#pieG-${containerId}-${i})`,stroke:'#fff','stroke-width':'2',cursor:'pointer'});
    path.addEventListener('mouseenter',(e)=>{path.setAttribute('opacity','0.85');showTooltip(e,`<strong>${item.label}</strong><br/>${item.value}人 · ${(item.value/total*100).toFixed(1)}%`)});
    path.addEventListener('mousemove',(e)=>showTooltip(e,`<strong>${item.label}</strong><br/>${item.value}人 · ${(item.value/total*100).toFixed(1)}%`));
    path.addEventListener('mouseleave',()=>{path.setAttribute('opacity','1');hideTooltip()});
    svg.appendChild(path);curAngle=endAngle;
  });
  const cc=createSVGElement('circle',{cx,cy,r:r*0.45,fill:'#fff'});svg.appendChild(cc);
  const ct=createSVGElement('text',{x:cx,y:cy-5,'text-anchor':'middle','font-size':'22','font-weight':'700',fill:BRAND_COLORS.primary});
  ct.textContent=total;svg.appendChild(ct);
  const cl=createSVGElement('text',{x:cx,y:cy+16,'text-anchor':'middle','font-size':'11',fill:BRAND_COLORS.primaryLight});
  cl.textContent='总人数';svg.appendChild(cl);
  if(options.showLegend!==false){
    data.forEach((item,i)=>{
      const [c1]=PURPLE_GRADIENTS[i%PURPLE_GRADIENTS.length];
      const ly=20+i*22;
      svg.appendChild(createSVGElement('rect',{x:w-80,y:ly-8,width:12,height:12,rx:3,fill:c1}));
      const t=createSVGElement('text',{x:w-62,y:ly+3,fill:'#4a4a6a','font-size':'11','font-family':'Microsoft YaHei'});
      t.textContent=`${item.label} ${item.value}`;svg.appendChild(t);
    });
  }
  container.appendChild(svg);
}

// 柱状图
function renderBarChart(containerId,data,options={}){
  const container=document.getElementById(containerId);if(!container)return;
  container.innerHTML='';
  const w=container.clientWidth||options.width||360;
  const h=Math.min(w*0.7,options.height||250);
  const m={top:20,right:20,bottom:40,left:40};
  const cw=w-m.left-m.right,ch=h-m.top-m.bottom;
  const max=Math.max(...data.map(d=>d.value))*1.1;
  const bw=(cw/data.length)*0.55,gap=(cw/data.length)*0.45;
  const svg=createSVGElement('svg',{width:w,height:h,viewBox:`0 0 ${w} ${h}`});
  const defs=createSVGElement('defs');
  const g=createSVGElement('linearGradient',{id:`barG-${containerId}`,x1:'0%',y1:'0%',x2:'0%',y2:'100%'});
  g.appendChild(createSVGElement('stop',{offset:'0%','stop-color':BRAND_COLORS.primary}));
  g.appendChild(createSVGElement('stop',{offset:'100%','stop-color':BRAND_COLORS.primaryDark}));defs.appendChild(g);svg.appendChild(defs);
  for(let i=0;i<=5;i++){const y=m.top+(ch/5)*i,val=Math.round(max*(1-i/5));
    svg.appendChild(createSVGElement('line',{x1:m.left,y1,y2:y,x2:w-m.right,stroke:'#e8e0ec','stroke-width':'1','stroke-dasharray':'3,3'}));
    const t=createSVGElement('text',{x:m.left-6,y:y+4,fill:'#4a4a6a','font-size':'10','text-anchor':'end','font-family':'Microsoft YaHei'});t.textContent=val;svg.appendChild(t);
  }
  data.forEach((item,i)=>{
    const barH=(item.value/max)*ch,x=m.left+gap/2+i*(bw+gap),y=m.top+ch-barH;
    const rect=createSVGElement('rect',{x,y,width:bw,height:barH,rx:4,fill:`url(#barG-${containerId})`,cursor:'pointer'});
    rect.addEventListener('mouseenter',(e)=>{rect.setAttribute('opacity','0.85');showTooltip(e,`<strong>${item.label}</strong><br/>${item.value}人`)});
    rect.addEventListener('mousemove',(e)=>showTooltip(e,`<strong>${item.label}</strong><br/>${item.value}人`));
    rect.addEventListener('mouseleave',()=>{rect.setAttribute('opacity','1');hideTooltip()});svg.appendChild(rect);
    const vt=createSVGElement('text',{x:x+bw/2,y:y-5,'text-anchor':'middle','font-size':'11','font-weight':'600',fill:BRAND_COLORS.primary});vt.textContent=item.value;svg.appendChild(vt);
    const lb=createSVGElement('text',{x:x+bw/2,y:h-10,fill:'#4a4a6a','font-size':'10','text-anchor':'middle','font-family':'Microsoft YaHei'});lb.textContent=item.label;svg.appendChild(lb);
  });
  container.appendChild(svg);
}

// 雷达图
function renderRadarChart(containerId,data,options={}){
  const container=document.getElementById(containerId);if(!container)return;
  container.innerHTML='';
  const w=container.clientWidth||options.width||300;
  const h=Math.min(w,options.height||300);
  const cx=w/2,cy=h/2,r=Math.min(w,h)/2-45;
  const angleStep=(2*Math.PI)/data.length;
  const svg=createSVGElement('svg',{width:w,height:h,viewBox:`0 0 ${w} ${h}`});
  const defs=createSVGElement('defs');
  const g=createSVGElement('radialGradient',{id:`radarG-${containerId}`,cx:'50%',cy:'50%',r:'50%'});
  g.appendChild(createSVGElement('stop',{offset:'0%','stop-color':BRAND_COLORS.primary,'stop-opacity':'0.5'}));
  g.appendChild(createSVGElement('stop',{offset:'100%','stop-color':BRAND_COLORS.primaryDark,'stop-opacity':'0.15'}));defs.appendChild(g);svg.appendChild(defs);
  for(let l=1;l<=5;l++){const rr=(r/5)*l;const pts=data.map((_,i)=>{const a=i*angleStep-Math.PI/2;return `${cx+rr*Math.cos(a)},${cy+rr*Math.sin(a)}`}).join(' ');svg.appendChild(createSVGElement('polygon',{points:pts,fill:'none',stroke:'#e8e0ec','stroke-width':'1'}))}
  data.forEach((_,i)=>{const a=i*angleStep-Math.PI/2;svg.appendChild(createSVGElement('line',{x1:cx,y1:cy,x2:cx+r*Math.cos(a),y2:cy+r*Math.sin(a),stroke:'#e8e0ec','stroke-width':'1'}))});
  const pts=data.map((item,i)=>{const a=i*angleStep-Math.PI/2,rr=(item.value/item.max)*r;return `${cx+rr*Math.cos(a)},${cy+rr*Math.sin(a)}`}).join(' ');
  const area=createSVGElement('polygon',{points:pts,fill:`url(#radarG-${containerId})`,stroke:BRAND_COLORS.primary,'stroke-width':'2'});
  area.addEventListener('mouseenter',(e)=>showTooltip(e,data.map(d=>`${d.label}: ${d.value}`).join('<br/>')));
  area.addEventListener('mousemove',(e)=>showTooltip(e,data.map(d=>`${d.label}: ${d.value}`).join('<br/>')));
  area.addEventListener('mouseleave',hideTooltip);svg.appendChild(area);
  data.forEach((item,i)=>{const a=i*angleStep-Math.PI/2,rr=(item.value/item.max)*r,x=cx+rr*Math.cos(a),y=cy+rr*Math.sin(a);
    const c=createSVGElement('circle',{cx:x,cy:y,r:4,fill:BRAND_COLORS.primary,stroke:'#fff','stroke-width':'2',cursor:'pointer'});
    c.addEventListener('mouseenter',(e)=>{c.setAttribute('r','6');c.setAttribute('fill',BRAND_COLORS.accent);showTooltip(e,`<strong>${item.label}</strong><br/>${item.value}人`)});
    c.addEventListener('mouseleave',()=>{c.setAttribute('r','4');c.setAttribute('fill',BRAND_COLORS.primary);hideTooltip()});svg.appendChild(c);
    const lr=r+18,lx=cx+lr*Math.cos(a),ly=cy+lr*Math.sin(a);
    const t=createSVGElement('text',{x:lx,y:ly+3,'text-anchor':'middle','font-size':'11',fill:'#4a4a6a','font-family':'Microsoft YaHei'});t.textContent=item.label;svg.appendChild(t);
  });
  container.appendChild(svg);
}

  const defs=createSVGElement('defs');svg.appendChild(defs);
  const counts=quads.map(()=>0);const peopleIn=quads.map(()=>[]);
  data.forEach(p=>{const qx=Math.min(2,Math.floor(p.x/1.67)),qy=Math.min(2,Math.floor(p.y/1.67));const idx=quads.findIndex(q=>q.x===qx&&q.y===qy);if(idx!==-1){counts[idx]++;peopleIn[idx].push(p)}});

    const rect=createSVGElement('rect',{x,y,width:cellW,height:cellH,fill:`url(#${gid})`,stroke:'#fff','stroke-width':'2',rx:5,cursor:'pointer',opacity:'0.85'});
    rect.addEventListener('mouseenter',()=>rect.setAttribute('opacity','1'));rect.addEventListener('mouseleave',()=>rect.setAttribute('opacity','0.85'));
    rect.addEventListener('click',()=>{if(options.onCellClick)options.onCellClick(q.label,peopleIn[i])});svg.appendChild(rect);
    const t=createSVGElement('text',{x:x+cellW/2,y:y+cellH/2-5,'text-anchor':'middle','font-size':'13','font-weight':'600',fill:'#fff','font-family':'Microsoft YaHei'});t.textContent=q.label;svg.appendChild(t);
    const ct=createSVGElement('text',{x:x+cellW/2,y:y+cellH/2+14,'text-anchor':'middle','font-size':'18','font-weight':'700',fill:'#fff'});ct.textContent=counts[i]+'人';svg.appendChild(ct);
  });
  const aS={fill:'#4a4a6a','font-size':'11','font-family':'Microsoft YaHei'};
  ['低绩效','中绩效','高绩效'].forEach((l,i)=>{const t=createSVGElement('text',{x:pad+cellW*i+cellW/2,y:h-14,...aS,'text-anchor':'middle'});t.textContent=l;svg.appendChild(t)});
  ['低潜力','中潜力','高潜力'].forEach((l,i)=>{const t=createSVGElement('text',{x:14,y:pad+cellH*(2-i)+cellH/2+3,...aS,'text-anchor':'middle',transform:`rotate(-90,14,${pad+cellH*(2-i)+cellH/2+3})`});t.textContent=l;svg.appendChild(t)});
  container.appendChild(svg);
}

// ===== 驾驶舱初始化 =====
(function init(){
  // 统计卡片
  document.getElementById('totalCadres').textContent=cadres.length;
  document.getElementById('activeCadres').textContent=cadres.filter(c=>c.status==='在任').length;
  document.getElementById('pendingAppointments').textContent=appointments.filter(a=>a.status==='待审批').length;
  document.getElementById('alertCount').textContent=alerts.length;

  // 职级分布饼图
  const levelCount={};
  cadres.forEach(c=>{levelCount[c.positionLevel]=(levelCount[c.positionLevel]||0)+1});
  // 按预设顺序排列
  const levelOrder=['集团领导','部门正职','部门副职','高级主管','主管','专员'];
  const levelData=levelOrder.filter(l=>levelCount[l]).map(l=>({label:l,value:levelCount[l]}));
  renderPieChart('levelPieChart',levelData,{showLegend:true});

  // 年龄分布柱状图
  const ageRanges={'30岁以下':0,'31-40岁':0,'41-50岁':0,'50岁以上':0};
  cadres.forEach(c=>{if(c.age<30)ageRanges['30岁以下']++;else if(c.age<=40)ageRanges['31-40岁']++;else if(c.age<=50)ageRanges['41-50岁']++;else ageRanges['50岁以上']++});
  renderBarChart('ageBarChart',Object.entries(ageRanges).map(([l,v])=>({label:l,value:v})));

  // 学历分布雷达图
  const eduCount={};
  cadres.forEach(c=>eduCount[c.education]=(eduCount[c.education]||0)+1);
  const eduData=Object.entries(eduCount).map(([l,v])=>({label:l,value:v,max:Math.max(...Object.values(eduCount))+2}));
  renderRadarChart('eduRadarChart',eduData);

  // 九宫格缩略
  const merged=reviews.map(r=>{const c=cadres.find(ca=>ca.id===r.cadreId);return{name:c?c.name:r.cadreId,x:r.nineBoxX,y:r.nineBoxY}});
  renderNineBox('nineBoxMini',merged,{onCellClick:(label,people)=>{
    const html=people.length===0?'<p style="color:#4a4a6a">该象限暂无人员。</p>'
      :'<div class="people-list">'+people.map(p=>`
        <div class="people-item">
          <div class="people-avatar">${p.name.charAt(0)}</div>
          <div class="people-info">
            <div class="people-name">${p.name}</div>
          </div>
        </div>`).join('')+'</div>';
    showModal(label+'（'+people.length+'人）',html);
  }});

  // 预警列表
  const alertList=document.getElementById('alertList');
  const priorityMap={'高':'high','中':'medium','低':'low'};
  alerts.slice(0,5).forEach(a=>{
    const pClass=priorityMap[a.priority]||'medium';
    const item=document.createElement('div');
    item.className='alert-item '+pClass;
    item.innerHTML=`
      <div class="alert-icon ${pClass}">⚠️</div>
      <div class="alert-content">
        <div class="alert-title">${a.type} · ${a.cadreName}</div>
        <div class="alert-desc">${a.position} · ${a.description.substring(0,30)}...</div>
      </div>
      <div class="alert-days ${pClass}">剩${a.daysRemaining}天</div>
    `;
    alertList.appendChild(item);
  });
})();
</script>
